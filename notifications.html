 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nemi Mart | Elite Notifications</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        /* ==========================================================================
           1. CORE ARCHITECTURE & VARIABLES
           ========================================================================== */
        :root {
            --brand-gold: #D4AF37;
            --brand-gold-glow: rgba(212, 175, 55, 0.4);
            --brand-green: #0F5132;
            --bg-cream: #FCFBF7;
            --text-main: #1A1A1A;
            --text-muted: #64748B;
            --card-bg: rgba(255, 255, 255, 0.95);
            --glass-border: rgba(212, 175, 55, 0.2);
            --glass-bg: rgba(252, 251, 247, 0.7);
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 30px -5px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 20px 40px -10px rgba(212, 175, 55, 0.15);
            --transition-bounce: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --danger: #EF4444;
        }

        /* ==========================================================================
           2. GLOBAL RESET & AMBIENT ELEMENTS
           ========================================================================== */
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-cream);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: ''; position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.03) 0%, transparent 40%),
                        radial-gradient(circle at 80% 20%, rgba(15, 81, 50, 0.02) 0%, transparent 30%);
            animation: ambientShift 20s infinite linear alternate;
            z-index: -1; pointer-events: none;
        }

        @keyframes ambientShift { 0% { transform: rotate(0deg); } 100% { transform: rotate(5deg); } }

        /* ==========================================================================
           3. NAVIGATION
           ========================================================================== */
        .nav-bar {
            position: sticky; top: 0; z-index: 1000;
            background: var(--glass-bg); backdrop-filter: blur(24px);
            padding: 16px 24px; display: flex; align-items: center;
            border-bottom: 1px solid var(--glass-border);
        }

        .back-link {
            width: 40px; height: 40px; border-radius: 12px; background: white;
            border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center;
            color: var(--text-main); text-decoration: none; transition: var(--transition-bounce);
        }

        .nav-title {
            flex: 1; text-align: center; font-family: 'Outfit', sans-serif;
            font-size: 18px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase;
            background: linear-gradient(135deg, var(--brand-green), var(--brand-gold));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* ==========================================================================
           4. MAIN FEED & HEADER
           ========================================================================== */
        .feed-container { max-width: 550px; margin: 0 auto; padding: 25px 20px 100px; }

        .feed-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 30px;
        }

        .feed-header h2 {
            font-family: 'Outfit', sans-serif; font-size: 28px; font-weight: 900;
        }

        /* Compact Wipe Button */
        .wipe-btn-mini {
            width: 36px; height: 36px; border-radius: 10px;
            background: rgba(239, 68, 68, 0.1); color: var(--danger);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; border: 1px solid rgba(239, 68, 68, 0.1);
            transition: var(--transition-smooth);
        }

        .wipe-btn-mini:hover {
            background: var(--danger); color: white; transform: rotate(15deg);
        }

        /* ==========================================================================
           5. PREMIUM CARDS SYSTEM
           ========================================================================== */
        .card-item {
            background: var(--card-bg); border-radius: 24px; padding: 18px;
            margin-bottom: 16px; display: flex; gap: 15px; align-items: center;
            border: 1px solid rgba(255,255,255,0.8); box-shadow: var(--shadow-md);
            animation: slideUpFade 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
        }

        @keyframes slideUpFade { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .orbit-container {
            position: relative; width: 60px; height: 60px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }

        .main-icon {
            width: 44px; height: 44px; border-radius: 14px; background: white;
            border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center;
            color: var(--brand-gold); z-index: 5;
        }

        .orbit-line {
            position: absolute; width: 100%; height: 100%;
            border: 1px dashed rgba(197, 160, 89, 0.4); border-radius: 50%;
            animation: spinRing 8s linear infinite;
        }

        @keyframes spinRing { 100% { transform: rotate(360deg); } }

        .card-content { flex: 1; }
        .card-content h3 { font-size: 16px; font-weight: 800; margin-bottom: 4px; }
        .card-content p { font-size: 13px; color: var(--text-muted); line-height: 1.4; }

        .card-meta { margin-top: 10px; display: flex; justify-content: space-between; align-items: center; }
        .time-badge { font-size: 9px; font-weight: 800; color: var(--brand-gold); text-transform: uppercase; }

        .bin-btn {
            background: none; border: none; color: var(--text-muted); cursor: pointer;
            transition: 0.3s; padding: 5px;
        }
        .bin-btn:hover { color: var(--danger); }

        /* ==========================================================================
           6. CUSTOM MODAL SYSTEM (No Browser Alerts)
           ========================================================================== */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px); display: none;
            align-items: center; justify-content: center; z-index: 9999;
            padding: 20px;
        }

        .modal-card {
            background: white; width: 100%; max-width: 340px; border-radius: 28px;
            padding: 30px; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.2);
            transform: scale(0.9); transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active { display: flex; }
        .modal-overlay.active .modal-card { transform: scale(1); }

        .modal-icon {
            width: 60px; height: 60px; background: rgba(239, 68, 68, 0.1);
            color: var(--danger); border-radius: 50%; display: flex;
            align-items: center; justify-content: center; font-size: 24px;
            margin: 0 auto 20px;
        }

        .modal-btns { display: flex; gap: 12px; margin-top: 25px; }
        .m-btn {
            flex: 1; padding: 12px; border-radius: 14px; font-weight: 700;
            cursor: pointer; border: none; transition: 0.3s;
        }
        .btn-cancel { background: #F1F5F9; color: var(--text-muted); }
        .btn-confirm { background: var(--danger); color: white; }

        /* ==========================================================================
           7. TOAST & SKELETON
           ========================================================================== */
        #toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: #1A1A1A; color: white; padding: 12px 24px; border-radius: 50px;
            font-size: 13px; font-weight: 600; z-index: 10000; transition: 0.4s;
        }
        #toast.show { transform: translateX(-50%) translateY(0); }

        .skeleton-card {
            background: white; border-radius: 24px; height: 100px; margin-bottom: 15px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 50% { opacity: 0.5; } }

    </style>
</head>
<body>

    <nav class="nav-bar">
        <a href="javascript:history.back()" class="back-link"><i class="fa-solid fa-chevron-left"></i></a>
        <div class="nav-title">Nemi Mart Updates</div>
    </nav>

    <main class="feed-container">
        <header class="feed-header">
            <h2>Inbox</h2>
            <div class="wipe-btn-mini" onclick="openWipeModal()" title="Clear Inbox">
                <i class="fa-solid fa-broom"></i>
            </div>
        </header>

        <div id="loader">
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
        </div>
        
        <div id="notif-list"></div>

        <div id="empty-state" style="display:none; text-align:center; padding: 100px 20px;">
            <i class="fa-solid fa-cloud-moon" style="font-size: 50px; color: #CBD5E1; margin-bottom: 15px;"></i>
            <h3 style="color: #64748B;">All Caught Up!</h3>
        </div>
    </main>

    <div class="modal-overlay" id="wipeModal">
        <div class="modal-card">
            <div class="modal-icon"><i class="fa-solid fa-trash-can"></i></div>
            <h3 style="margin-bottom: 10px;">Clear Inbox?</h3>
            <p style="color: #64748B; font-size: 14px;">This will permanently remove all notifications from your feed.</p>
            <div class="modal-btns">
                <button class="m-btn btn-cancel" onclick="closeWipeModal()">Cancel</button>
                <button class="m-btn btn-confirm" onclick="confirmClear()">Clear All</button>
            </div>
        </div>
    </div>

    <div id="toast">Action completed successfully</div>

    <script>
        // FIREBASE
        const firebaseConfig = { databaseURL: "https://nemi-mart-2-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // CORE LOGIC
        function fetchUpdates() {
            const list = document.getElementById('notif-list');
            const loader = document.getElementById('loader');
            const empty = document.getElementById('empty-state');

            db.ref('notifications').on('value', (snap) => {
                loader.style.display = 'none';
                list.innerHTML = '';
                const data = snap.val();

                if (!data) {
                    empty.style.display = 'block';
                    return;
                }

                empty.style.display = 'none';
                Object.keys(data).reverse().forEach((key, i) => {
                    const item = data[key];
                    const card = document.createElement('div');
                    card.className = 'card-item';
                    card.style.animationDelay = (i * 0.05) + 's';
                    
                    let icon = 'fa-tag';
                    if(item.type === 'order') icon = 'fa-box-open';
                    if(item.type === 'alert') icon = 'fa-triangle-exclamation';

                    card.innerHTML = `
                        <div class="orbit-container">
                            <div class="orbit-line"></div>
                            <div class="main-icon"><i class="fa-solid ${icon}"></i></div>
                        </div>
                        <div class="card-content">
                            <h3>${item.title || 'Official Update'}</h3>
                            <p>${item.message || 'New premium content available.'}</p>
                            <div class="card-meta">
                                <span class="time-badge">${getRelativeTime(item.timestamp)}</span>
                                <button class="bin-btn" onclick="deleteItem('${key}')"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                    `;
                    list.appendChild(card);
                });
            });
        }

        function getRelativeTime(ts) {
            if(!ts) return "Just now";
            const s = Math.floor((Date.now() - ts) / 1000);
            if(s < 60) return "Now";
            if(s < 3600) return Math.floor(s/60) + "m ago";
            if(s < 86400) return Math.floor(s/3600) + "h ago";
            return new Date(ts).toLocaleDateString();
        }

        // MODAL & ACTIONS
        function openWipeModal() { document.getElementById('wipeModal').classList.add('active'); }
        function closeWipeModal() { document.getElementById('wipeModal').classList.remove('active'); }

        function confirmClear() {
            closeWipeModal();
            db.ref('notifications').remove().then(() => showToast("Inbox cleared successfully"));
        }

        function deleteItem(id) {
            db.ref('notifications/' + id).remove().then(() => showToast("Notification deleted"));
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        window.onload = fetchUpdates;
    </script>
</body>
</html>
