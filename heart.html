 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nemi Mart | My Wishlist</title>
    
    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        /* ============================================================
           ROOT VARIABLES - PREMIUM GREEN/CREME/GOLD THEME
           ============================================================ */
        :root {
            --creme: #FDFBF7;
            --creme-dark: #F5F1E6;
            --gold: #D4AF37;
            --gold-light: #FAF4E5;
            --gold-hover: #B8860B;
            --dark-green: #0F2517;
            --leaf-green: #1A3E26;
            --leaf-light: #eaf2e9;
            --white: #FFFFFF;
            --text-dark: #1F2937;
            --text-muted: #5C6F63;
            --heart-red: #EF4444;
            --success-green: #059669;
            --border-light: #EAE5D9;
            
            --radius-xl: 28px;
            --radius-lg: 20px;
            --radius-md: 16px;
            --radius-sm: 12px;
            
            --shadow-soft: 0 8px 25px rgba(0,0,0,0.04);
            --shadow-card: 0 15px 35px -8px rgba(15,37,23,0.1);
            --shadow-hover: 0 25px 45px -10px rgba(212,175,55,0.2);
            --shadow-gold: 0 10px 25px rgba(212,175,55,0.15);
            
            --transition: all 0.35s cubic-bezier(0.23, 1, 0.32, 1);
            --bounce: cubic-bezier(0.68, -0.55, 0.27, 1.55);
            
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--creme);
            color: var(--text-dark);
            line-height: 1.5;
            overflow-x: hidden;
            width: 100%;
            min-height: 100vh;
            animation: pageLoad 0.5s ease-out;
            padding-top: var(--safe-top);
        }

        @keyframes pageLoad {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--creme-dark); }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }

        /* ============================================================
           LOADER
           ============================================================ */
        #pageLoader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(253, 251, 247, 0.98);
            backdrop-filter: blur(8px);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.4s;
        }
        
        .loader-spinner {
            width: 50px; height: 50px;
            border: 3px solid var(--gold-light);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .loader-text {
            margin-top: 16px;
            font-weight: 700;
            color: var(--dark-green);
            letter-spacing: 1.5px;
            font-size: 13px;
        }

        /* ============================================================
           TOAST NOTIFICATIONS
           ============================================================ */
        #toastContainer {
            position: fixed;
            top: calc(15px + var(--safe-top));
            left: 15px;
            right: 15px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }
        
        .toast {
            background: var(--dark-green);
            color: white;
            padding: 14px 18px;
            border-radius: 14px;
            border-left: 4px solid var(--gold);
            box-shadow: var(--shadow-card);
            animation: slideDown 0.3s ease-out;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 13px;
            pointer-events: auto;
            backdrop-filter: blur(5px);
        }
        
        .toast.success { border-left-color: var(--success-green); background: #0a3622; }
        .toast.error { border-left-color: var(--heart-red); background: #3b1e1e; }
        .toast.info { border-left-color: var(--gold); }
        
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ============================================================
           HEADER - STICKY PREMIUM
           ============================================================ */
        .header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(253, 251, 247, 0.96);
            backdrop-filter: blur(15px);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid var(--gold);
            box-shadow: var(--shadow-soft);
        }

        .back-btn {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: var(--white);
            border: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--dark-green);
            text-decoration: none;
            transition: var(--transition);
            box-shadow: var(--shadow-soft);
        }

        .back-btn:active {
            background: var(--gold);
            color: white;
            transform: scale(0.95);
        }

        .header-title {
            font-family: 'Outfit', sans-serif;
            font-size: 22px;
            font-weight: 800;
            color: var(--dark-green);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .header-title i {
            color: var(--heart-red);
            font-size: 22px;
            animation: heartbeat 1.5s ease-in-out infinite;
        }
        
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.15); }
            50% { transform: scale(1); }
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }
        
        .header-btn {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: var(--gold-light);
            border: 1px solid var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
            cursor: pointer;
            transition: var(--transition);
        }
        
        .header-btn:active {
            background: var(--gold);
            color: white;
            transform: scale(0.95);
        }

        /* ============================================================
           STATS BAR
           ============================================================ */
        .stats-bar {
            display: flex;
            gap: 12px;
            padding: 16px 20px;
        }
        
        .stat-card {
            flex: 1;
            background: var(--white);
            padding: 14px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-soft);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: fadeInUp 0.5s ease-out;
        }
        
        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: var(--gold-light);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
            font-size: 22px;
        }
        
        .stat-content h3 {
            font-size: 24px;
            font-weight: 800;
            color: var(--dark-green);
            line-height: 1.2;
        }
        
        .stat-content p {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ============================================================
           WISHLIST CONTAINER
           ============================================================ */
        .wishlist-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 8px 16px 100px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0 16px;
        }
        
        .section-header h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 18px;
            font-weight: 800;
            color: var(--dark-green);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .section-header h2 i {
            color: var(--gold);
        }
        
        .clear-all-btn {
            background: none;
            border: 1px solid var(--border-light);
            padding: 8px 14px;
            border-radius: 25px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
        }
        
        .clear-all-btn:active {
            background: var(--heart-red);
            color: white;
            border-color: var(--heart-red);
        }

        /* ============================================================
           WISHLIST GRID - PREMIUM CARDS
           ============================================================ */
        .wishlist-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .wish-card {
            background: var(--white);
            border-radius: var(--radius-xl);
            padding: 16px;
            display: flex;
            gap: 16px;
            box-shadow: var(--shadow-card);
            border: 1px solid var(--border-light);
            transition: var(--transition);
            animation: cardSlideIn 0.5s ease-out backwards;
            position: relative;
            overflow: hidden;
        }
        
        .wish-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(to bottom, var(--gold), var(--gold-hover));
            opacity: 0;
            transition: var(--transition);
        }
        
        .wish-card:hover::before {
            opacity: 1;
        }
        
        .wish-card:active {
            transform: scale(0.99);
            box-shadow: var(--shadow-hover);
        }
        
        @keyframes cardSlideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        .wish-card.removing {
            animation: cardSlideOut 0.4s ease-out forwards;
        }
        
        @keyframes cardSlideOut {
            to { opacity: 0; transform: translateX(100px); }
        }

        .card-img {
            width: 100px;
            height: 100px;
            border-radius: var(--radius-lg);
            overflow: hidden;
            background: var(--creme-dark);
            flex-shrink: 0;
            box-shadow: var(--shadow-soft);
        }
        
        .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s;
        }
        
        .wish-card:active .card-img img {
            transform: scale(1.08);
        }

        .card-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .product-category {
            font-size: 9px;
            font-weight: 800;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        
        .product-name {
            font-size: 16px;
            font-weight: 800;
            color: var(--dark-green);
            margin-bottom: 4px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .product-price {
            font-size: 18px;
            font-weight: 800;
            color: var(--gold);
        }
        
        .old-price {
            font-size: 12px;
            color: var(--text-muted);
            text-decoration: line-through;
            margin-left: 6px;
        }
        
        .stock-badge {
            display: inline-block;
            font-size: 9px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 20px;
            margin-top: 6px;
        }
        
        .stock-badge.in-stock {
            background: #dcfce7;
            color: var(--success-green);
        }
        
        .stock-badge.limited {
            background: #fef9c3;
            color: #854d0e;
        }

        .card-actions {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-end;
            gap: 8px;
        }

        .action-btn {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: var(--white);
            border: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            font-size: 18px;
        }
        
        .heart-btn {
            color: var(--heart-red);
            background: #FFF5F5;
            border-color: #FECACA;
        }
        
        .heart-btn:active {
            background: var(--heart-red);
            color: white;
            transform: scale(0.9);
        }
        
        .share-btn {
            color: var(--dark-green);
            background: var(--gold-light);
            border-color: var(--gold);
        }
        
        .share-btn:active {
            background: var(--gold);
            color: white;
            transform: scale(0.9);
        }
        
        .cart-btn {
            color: var(--dark-green);
            background: var(--leaf-light);
            border-color: var(--leaf-green);
        }
        
        .cart-btn:active {
            background: var(--leaf-green);
            color: white;
            transform: scale(0.9);
        }

        /* ============================================================
           EMPTY STATE - BEAUTIFUL
           ============================================================ */
        .empty-state {
            display: none;
            text-align: center;
            padding: 60px 30px;
            animation: fadeIn 0.6s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .empty-icon {
            font-size: 90px;
            color: var(--gold-light);
            margin-bottom: 24px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        
        .empty-state h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 26px;
            font-weight: 800;
            color: var(--dark-green);
            margin-bottom: 12px;
        }
        
        .empty-state p {
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .explore-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 36px;
            background: linear-gradient(135deg, var(--dark-green), var(--leaf-green));
            color: var(--gold);
            border-radius: 40px;
            text-decoration: none;
            font-weight: 800;
            font-size: 16px;
            border: 2px solid var(--gold);
            box-shadow: var(--shadow-gold);
            transition: var(--transition);
        }
        
        .explore-btn:active {
            transform: scale(0.96);
            background: var(--gold);
            color: var(--dark-green);
        }

        /* ============================================================
           LOADING SKELETON
           ============================================================ */
        .skeleton-card {
            background: var(--white);
            border-radius: var(--radius-xl);
            padding: 16px;
            display: flex;
            gap: 16px;
            border: 1px solid var(--border-light);
        }
        
        .skeleton-img {
            width: 100px;
            height: 100px;
            border-radius: var(--radius-lg);
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        
        .skeleton-content {
            flex: 1;
        }
        
        .skeleton-line {
            height: 14px;
            border-radius: 4px;
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            margin-bottom: 8px;
        }
        
        .skeleton-line.short {
            width: 60%;
        }
        
        .skeleton-line.medium {
            width: 80%;
        }
        
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* ============================================================
           RECOMMENDED SECTION
           ============================================================ */
        .recommended-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border-light);
        }
        
        .rec-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 16px;
        }
        
        .rec-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 12px;
            border: 1px solid var(--border-light);
            text-decoration: none;
            transition: var(--transition);
        }
        
        .rec-card:active {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
        }
        
        .rec-img {
            width: 100%;
            aspect-ratio: 1;
            border-radius: var(--radius-md);
            overflow: hidden;
            margin-bottom: 8px;
        }
        
        .rec-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .rec-name {
            font-size: 13px;
            font-weight: 700;
            color: var(--dark-green);
            margin-bottom: 4px;
        }
        
        .rec-price {
            font-size: 14px;
            font-weight: 800;
            color: var(--gold);
        }

        /* ============================================================
           MOBILE OPTIMIZATIONS
           ============================================================ */
        @media (max-width: 380px) {
            .card-img { width: 85px; height: 85px; }
            .product-name { font-size: 14px; }
            .action-btn { width: 40px; height: 40px; }
        }
    </style>
</head>
<body>

<div id="toastContainer"></div>
<div id="pageLoader">
    <div class="loader-spinner"></div>
    <div class="loader-text">LOADING YOUR FAVORITES...</div>
</div>

<!-- HEADER -->
<div class="header">
    <a href="index.html" class="back-btn">
        <i class="fa-solid fa-chevron-left"></i>
    </a>
    <div class="header-title">
        <i class="fa-solid fa-heart"></i>
        My Wishlist
    </div>
    <div class="header-actions">
        <button class="header-btn" onclick="window.location.href='cart.html'">
            <i class="fa-solid fa-shopping-bag"></i>
        </button>
    </div>
</div>

<!-- STATS BAR -->
<div class="stats-bar">
    <div class="stat-card">
        <div class="stat-icon">
            <i class="fa-solid fa-heart"></i>
        </div>
        <div class="stat-content">
            <h3 id="wishlistCount">0</h3>
            <p>Saved Items</p>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-icon">
            <i class="fa-solid fa-tag"></i>
        </div>
        <div class="stat-content">
            <h3 id="totalValue">₹0</h3>
            <p>Total Value</p>
        </div>
    </div>
</div>

<!-- WISHLIST CONTAINER -->
<div class="wishlist-container">
    <div class="section-header">
        <h2><i class="fa-solid fa-list-ul"></i> Saved Products</h2>
        <button class="clear-all-btn" onclick="clearAllWishlist()">
            <i class="fa-solid fa-trash-alt"></i> Clear All
        </button>
    </div>
    
    <div class="wishlist-grid" id="wishlistGrid">
        <!-- Skeleton loading -->
        <div class="skeleton-card">
            <div class="skeleton-img"></div>
            <div class="skeleton-content">
                <div class="skeleton-line"></div>
                <div class="skeleton-line short"></div>
                <div class="skeleton-line medium"></div>
            </div>
        </div>
    </div>

    <!-- EMPTY STATE -->
    <div class="empty-state" id="emptyState">
        <div class="empty-icon">
            <i class="fa-regular fa-heart"></i>
        </div>
        <h2>Your Wishlist is Empty</h2>
        <p>Discover premium Ayurvedic products and save your favorites here!</p>
        <a href="index.html" class="explore-btn">
            <i class="fa-solid fa-compass"></i> Explore Products
        </a>
    </div>

    <!-- RECOMMENDED SECTION -->
    <div class="recommended-section" id="recommendedSection" style="display: none;">
        <div class="section-header">
            <h2><i class="fa-solid fa-star"></i> You May Also Like</h2>
        </div>
        <div class="rec-grid" id="recGrid"></div>
    </div>
</div>

<script>
    // ============================================================
    // FIREBASE CONFIG
    // ============================================================
    const firebaseConfig = {
        databaseURL: "https://nemi-mart-2-default-rtdb.firebaseio.com"
    };
    
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    
    const CLOUD_NAME = "despxo7zb";
    
    // ============================================================
    // GLOBAL STATE
    // ============================================================
    let wishlistIds = [];
    let wishlistProducts = [];
    let allProducts = [];
    
    // ============================================================
    // LOAD WISHLIST
    // ============================================================
    async function loadWishlist() {
        try {
            // Get wishlist IDs from localStorage
            const stored = localStorage.getItem('nemi_wishlist');
            wishlistIds = stored ? JSON.parse(stored) : [];
            
            // Fetch all products
            const snapshot = await database.ref('products').once('value');
            const products = snapshot.val();
            
            if (products) {
                allProducts = Object.keys(products).map(key => ({
                    id: key,
                    ...products[key]
                }));
            }
            
            // Filter wishlist products
            wishlistProducts = allProducts.filter(p => wishlistIds.includes(p.id));
            
            renderWishlist();
            updateStats();
            loadRecommendations();
            
        } catch (error) {
            console.error('Error loading wishlist:', error);
            showToast('Error loading wishlist', 'error');
        } finally {
            document.getElementById('pageLoader').style.opacity = '0';
            setTimeout(() => document.getElementById('pageLoader').style.display = 'none', 400);
        }
    }
    
    // ============================================================
    // RENDER WISHLIST
    // ============================================================
    function renderWishlist() {
        const grid = document.getElementById('wishlistGrid');
        const emptyState = document.getElementById('emptyState');
        const recSection = document.getElementById('recommendedSection');
        
        if (wishlistProducts.length === 0) {
            grid.innerHTML = '';
            emptyState.style.display = 'block';
            recSection.style.display = 'block';
            return;
        }
        
        emptyState.style.display = 'none';
        recSection.style.display = 'none';
        
        grid.innerHTML = wishlistProducts.map((p, index) => {
            const productName = p.title || p.name || 'Premium Product';
            const productImage = p.images?.[0] || p.img || p.image || p.cloudinaryUrl || 'https://raw.githubusercontent.com/nemimart/The-Nemi-Mart/main/logo.png';
            const price = p.finalPrice || p.price || 0;
            const oldPrice = p.price > price ? p.price : null;
            const stock = p.stock || 0;
            const stockClass = stock <= 0 ? 'out-stock' : (stock < 5 ? 'limited' : 'in-stock');
            const stockText = stock <= 0 ? 'Out of Stock' : (stock < 5 ? `Only ${stock} left` : 'In Stock');
            
            return `
                <div class="wish-card" id="wish-${p.id}" style="animation-delay: ${index * 0.08}s" onclick="goToProduct('${p.id}')">
                    <div class="card-img">
                        <img src="${productImage}" alt="${productName}" onerror="this.src='https://raw.githubusercontent.com/nemimart/The-Nemi-Mart/main/logo.png'">
                    </div>
                    <div class="card-content">
                        <span class="product-category">${p.category || 'Ayurveda'}</span>
                        <h3 class="product-name">${productName}</h3>
                        <div>
                            <span class="product-price">₹${price}</span>
                            ${oldPrice ? `<span class="old-price">₹${oldPrice}</span>` : ''}
                        </div>
                        <span class="stock-badge ${stockClass}">${stockText}</span>
                    </div>
                    <div class="card-actions" onclick="event.stopPropagation()">
                        <button class="action-btn heart-btn" onclick="removeFromWishlist('${p.id}')">
                            <i class="fa-solid fa-heart"></i>
                        </button>
                        <button class="action-btn share-btn" onclick="shareProduct('${p.id}', '${productName.replace(/'/g, "\\'")}', '${price}')">
                            <i class="fa-solid fa-arrow-up-from-bracket"></i>
                        </button>
                        ${stock > 0 ? `
                        <button class="action-btn cart-btn" onclick="addToCart('${p.id}')">
                            <i class="fa-solid fa-cart-shopping"></i>
                        </button>
                        ` : ''}
                    </div>
                </div>
            `;
        }).join('');
    }
    
    // ============================================================
    // LOAD RECOMMENDATIONS
    // ============================================================
    function loadRecommendations() {
        const recGrid = document.getElementById('recGrid');
        const recSection = document.getElementById('recommendedSection');
        
        if (wishlistProducts.length > 0) {
            recSection.style.display = 'none';
            return;
        }
        
        // Get random products (excluding wishlist items)
        const available = allProducts.filter(p => !wishlistIds.includes(p.id) && (p.stock || 0) > 0).slice(0, 4);
        
        if (available.length === 0) {
            recSection.style.display = 'none';
            return;
        }
        
        recSection.style.display = 'block';
        
        recGrid.innerHTML = available.map(p => {
            const productName = p.title || p.name || 'Product';
            const productImage = p.images?.[0] || p.img || 'https://raw.githubusercontent.com/nemimart/The-Nemi-Mart/main/logo.png';
            const price = p.finalPrice || p.price || 0;
            
            return `
                <a href="product.html?id=${p.id}" class="rec-card">
                    <div class="rec-img">
                        <img src="${productImage}" alt="${productName}">
                    </div>
                    <div class="rec-name">${productName.substring(0, 25)}${productName.length > 25 ? '...' : ''}</div>
                    <div class="rec-price">₹${price}</div>
                </a>
            `;
        }).join('');
    }
    
    // ============================================================
    // UPDATE STATS
    // ============================================================
    function updateStats() {
        document.getElementById('wishlistCount').textContent = wishlistProducts.length;
        
        const total = wishlistProducts.reduce((sum, p) => sum + (p.finalPrice || p.price || 0), 0);
        document.getElementById('totalValue').textContent = `₹${total}`;
    }
    
    // ============================================================
    // REMOVE FROM WISHLIST
    // ============================================================
    function removeFromWishlist(id) {
        const card = document.getElementById(`wish-${id}`);
        if (!card) return;
        
        // Animate removal
        card.classList.add('removing');
        
        setTimeout(() => {
            // Remove from localStorage
            wishlistIds = wishlistIds.filter(wid => wid !== id);
            localStorage.setItem('nemi_wishlist', JSON.stringify(wishlistIds));
            
            // Remove from products array
            wishlistProducts = wishlistProducts.filter(p => p.id !== id);
            
            renderWishlist();
            updateStats();
            loadRecommendations();
            
            showToast('Removed from wishlist', 'info');
        }, 350);
    }
    
    // ============================================================
    // CLEAR ALL WISHLIST
    // ============================================================
    function clearAllWishlist() {
        if (wishlistProducts.length === 0) {
            showToast('Wishlist already empty', 'info');
            return;
        }
        
        if (!confirm('Remove all items from wishlist?')) return;
        
        // Animate all cards
        document.querySelectorAll('.wish-card').forEach((card, i) => {
            setTimeout(() => card.classList.add('removing'), i * 50);
        });
        
        setTimeout(() => {
            localStorage.setItem('nemi_wishlist', JSON.stringify([]));
            wishlistIds = [];
            wishlistProducts = [];
            
            renderWishlist();
            updateStats();
            loadRecommendations();
            
            showToast('Wishlist cleared', 'success');
        }, 500);
    }
    
    // ============================================================
    // SHARE PRODUCT
    // ============================================================
    async function shareProduct(id, name, price) {
        const url = `${window.location.origin}/product.html?id=${id}`;
        const shareText = `✨ ${name} - ₹${price}\n\nPremium Ayurvedic product from Nemi Mart! 🌿\nCheck it out:`;
        
        if (navigator.share) {
            try {
                await navigator.share({
                    title: 'Nemi Mart',
                    text: shareText,
                    url: url
                });
            } catch (err) {
                console.log('Share cancelled');
            }
        } else {
            // Fallback - copy to clipboard
            const fullText = `${shareText}\n${url}`;
            navigator.clipboard?.writeText(fullText).then(() => {
                showToast('Product link copied! 📋', 'success');
            }).catch(() => {
                showToast('Could not copy link', 'error');
            });
        }
    }
    
    // ============================================================
    // ADD TO CART
    // ============================================================
    function addToCart(id) {
        const product = wishlistProducts.find(p => p.id === id);
        if (!product) return;
        
        const cart = JSON.parse(localStorage.getItem('nemi_cart')) || [];
        const existing = cart.findIndex(item => item.id === id);
        
        if (existing > -1) {
            cart[existing].qty = (cart[existing].qty || 1) + 1;
        } else {
            cart.push({
                id: id,
                name: product.title || product.name,
                price: product.finalPrice || product.price,
                img: product.images?.[0] || product.img,
                qty: 1
            });
        }
        
        localStorage.setItem('nemi_cart', JSON.stringify(cart));
        showToast('Added to cart! 🛒', 'success');
    }
    
    // ============================================================
    // GO TO PRODUCT
    // ============================================================
    function goToProduct(id) {
        window.location.href = `product.html?id=${id}`;
    }
    
    // ============================================================
    // TOAST NOTIFICATION
    // ============================================================
    function showToast(message, type = 'info') {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        
        const icons = { success: '✅', error: '❌', info: '💚' };
        toast.innerHTML = `<span>${icons[type] || '🔔'}</span> ${message}`;
        
        container.appendChild(toast);
        
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateY(-10px)';
            setTimeout(() => toast.remove(), 300);
        }, 2500);
    }
    
    // ============================================================
    // INIT
    // ============================================================
    document.addEventListener('DOMContentLoaded', () => {
        loadWishlist();
        
        // Listen for wishlist changes from other tabs
        window.addEventListener('storage', (e) => {
            if (e.key === 'nemi_wishlist') {
                wishlistIds = e.newValue ? JSON.parse(e.newValue) : [];
                wishlistProducts = allProducts.filter(p => wishlistIds.includes(p.id));
                renderWishlist();
                updateStats();
                loadRecommendations();
            }
        });
    });
    
    // Expose functions globally
    window.removeFromWishlist = removeFromWishlist;
    window.clearAllWishlist = clearAllWishlist;
    window.shareProduct = shareProduct;
    window.addToCart = addToCart;
    window.goToProduct = goToProduct;
</script>
</body>
</html>
