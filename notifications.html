 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nemi Mart | Elite Notifications</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        /* ==========================================================================
           1. DESIGN SYSTEM & VARIABLES
           ========================================================================== */
        :root {
            /* Core Colors */
            --brand-gold: #D4AF37;
            --brand-gold-glow: rgba(212, 175, 55, 0.4);
            --brand-green: #0F5132;
            --bg-cream: #FCFBF7;
            
            /* Text Colors */
            --text-main: #1A1A1A;
            --text-muted: #64748B;
            
            /* UI Elements */
            --card-bg: rgba(255, 255, 255, 0.95);
            --glass-border: rgba(212, 175, 55, 0.2);
            --glass-bg: rgba(252, 251, 247, 0.7);
            
            /* Shadows & Transitions */
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 30px -5px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 20px 40px -10px rgba(212, 175, 55, 0.15);
            --transition-bounce: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ==========================================================================
           2. RESET & BASE STYLES
           ========================================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-cream);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Ambient Animated Background */
        body::before {
            content: '';
            position: fixed;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: 
                radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.03) 0%, transparent 40%),
                radial-gradient(circle at 80% 20%, rgba(15, 81, 50, 0.02) 0%, transparent 30%);
            animation: ambientShift 20s infinite linear alternate;
            z-index: -1;
            pointer-events: none;
        }

        @keyframes ambientShift {
            0% { transform: rotate(0deg) scale(1); }
            100% { transform: rotate(5deg) scale(1.1); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(212, 175, 55, 0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--brand-gold); }

        /* ==========================================================================
           3. NAVBAR (GLASSMORPHISM)
           ========================================================================== */
        .nav-bar {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            box-shadow: var(--shadow-sm);
        }

        .back-link {
            width: 44px; height: 44px;
            border-radius: 14px;
            background: white;
            border: 1px solid var(--glass-border);
            display: flex; align-items: center; justify-content: center;
            color: var(--text-main);
            font-size: 18px;
            text-decoration: none;
            transition: var(--transition-bounce);
            box-shadow: var(--shadow-sm);
        }

        .back-link:hover {
            transform: translateY(-2px);
            border-color: var(--brand-gold);
            box-shadow: 0 5px 15px var(--brand-gold-glow);
        }

        .back-link:active { transform: scale(0.9); }

        .nav-title {
            flex: 1;
            text-align: center;
            font-family: 'Outfit', sans-serif;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-right: 44px; /* Balance the back button */
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--brand-green), var(--brand-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ==========================================================================
           4. MAIN FEED LAYOUT
           ========================================================================== */
        .feed-container {
            max-width: 550px;
            margin: 0 auto;
            padding: 30px 20px 100px;
        }

        .feed-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 35px;
            padding: 0 5px;
        }

        .feed-header h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 32px;
            font-weight: 900;
            line-height: 1.1;
            color: var(--text-main);
        }

        .wipe-btn {
            color: #EF4444;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(239, 68, 68, 0.05);
            transition: var(--transition-smooth);
        }

        .wipe-btn:hover {
            background: #EF4444;
            color: white;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
            transform: translateY(-2px);
        }

        /* ==========================================================================
           5. SKELETON LOADER (PRO LEVEL)
           ========================================================================== */
        .skeleton-wrapper { display: flex; flex-direction: column; gap: 15px; }
        .skeleton-card {
            background: white; border-radius: 22px; padding: 20px;
            display: flex; gap: 15px; border: 1px solid rgba(0,0,0,0.02);
        }
        .skeleton-icon {
            width: 60px; height: 60px; border-radius: 50%;
            background: #EEE; flex-shrink: 0;
            animation: pulseBg 1.5s infinite;
        }
        .skeleton-content { flex: 1; display: flex; flex-direction: column; gap: 10px; justify-content: center; }
        .skeleton-line { height: 12px; background: #EEE; border-radius: 6px; animation: pulseBg 1.5s infinite; }
        .skeleton-line.short { width: 50%; }

        @keyframes pulseBg {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        /* ==========================================================================
           6. THE PREMIUM CARD DESIGN
           ========================================================================== */
        .card-item {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 18px;
            display: flex;
            gap: 18px;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.8);
            box-shadow: var(--shadow-md);
            position: relative;
            overflow: hidden;
            transition: var(--transition-bounce);
            animation: slideUpFade 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
            cursor: pointer;
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Hover Effects for Card */
        .card-item:hover {
            transform: translateY(-5px) scale(1.01);
            box-shadow: var(--shadow-hover);
            border-color: var(--glass-border);
        }

        /* Inner Glow on Hover */
        .card-item::after {
            content: ''; position: absolute; inset: 0;
            border-radius: 24px;
            box-shadow: inset 0 0 0 2px transparent;
            transition: var(--transition-smooth);
            pointer-events: none;
        }
        .card-item:hover::after {
            box-shadow: inset 0 0 0 1px var(--brand-gold);
        }

        /* ==========================================================================
           7. ADVANCED ORBITING SYSTEM
           ========================================================================== */
        .orbit-container {
            position: relative;
            width: 65px;
            height: 65px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Center Main Icon */
        .main-icon {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            background: white;
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--brand-gold);
            z-index: 5;
            box-shadow: 0 4px 10px rgba(0,0,0,0.04);
            transition: var(--transition-bounce);
        }

        /* Icon Hover Interaction */
        .card-item:hover .main-icon {
            transform: scale(1.1) rotate(5deg);
            background: var(--brand-gold);
            color: white;
            box-shadow: 0 5px 15px var(--brand-gold-glow);
        }

        /* The Outer Rotating Ring */
        .orbit-line {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 1px dashed rgba(197, 160, 89, 0.4);
            border-radius: 50%;
            animation: spinRing 8s linear infinite;
            transition: var(--transition-smooth);
        }

        .card-item:hover .orbit-line {
            border-color: var(--brand-gold);
            animation-duration: 4s; /* Speeds up on hover */
        }

        /* Floating Mini Products */
        .mini-product {
            position: absolute;
            font-size: 11px;
            color: var(--brand-green);
            background: white;
            width: 20px; height: 20px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            animation: orbitFloat 6s linear infinite;
            z-index: 10;
        }

        .p1 { top: -2px; left: 50%; margin-left: -10px; animation-delay: 0s; }
        .p2 { bottom: 10px; right: -8px; animation-delay: -2s; }
        .p3 { bottom: 10px; left: -8px; animation-delay: -4s; }

        @keyframes spinRing { 100% { transform: rotate(360deg); } }
        
        @keyframes orbitFloat {
            0% { transform: rotate(0deg) translateY(32px) rotate(0deg); }
            100% { transform: rotate(360deg) translateY(32px) rotate(-360deg); }
        }

        /* ==========================================================================
           8. CARD CONTENT & TYPOGRAPHY
           ========================================================================== */
        .card-content { flex: 1; padding-right: 5px; }
        
        .card-content h3 {
            font-family: 'Outfit', sans-serif;
            font-size: 17px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 6px;
            transition: var(--transition-smooth);
        }

        .card-item:hover .card-content h3 { color: var(--brand-green); }

        .card-content p {
            font-size: 13.5px;
            color: var(--text-muted);
            line-height: 1.5;
            font-weight: 500;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Meta Data Row */
        .card-meta {
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .time-badge {
            font-size: 10px;
            font-weight: 800;
            color: var(--brand-gold);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: rgba(212, 175, 55, 0.1);
            padding: 4px 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* ==========================================================================
           9. INTERACTIVE DELETE BUTTON
           ========================================================================== */
        .bin-btn {
            width: 36px; height: 36px;
            border-radius: 12px;
            background: rgba(239, 68, 68, 0.08);
            color: #EF4444;
            border: none;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition-bounce);
            position: relative;
            overflow: hidden;
            z-index: 10;
        }

        .bin-btn::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 0; height: 0;
            background: #EF4444;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.4s ease, height 0.4s ease;
            z-index: -1;
        }

        .bin-btn:hover { color: white; transform: scale(1.1); }
        .bin-btn:hover::before { width: 150%; height: 150%; }
        .bin-btn:hover i { animation: shake 0.4s ease-in-out; }

        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-15deg); }
            75% { transform: rotate(15deg); }
        }

        /* ==========================================================================
           10. EMPTY STATE & UTILITIES
           ========================================================================== */
        .empty-box {
            text-align: center;
            padding: 80px 20px;
            display: none;
            animation: fadeIn 0.8s ease;
        }

        .empty-box i {
            font-size: 60px;
            color: rgba(212, 175, 55, 0.3);
            margin-bottom: 20px;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.05));
        }

        .empty-box h3 { font-family: 'Outfit'; font-size: 22px; color: var(--text-muted); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* ==========================================================================
           11. HAPTIC TOAST NOTIFICATION
           ========================================================================== */
        #toast {
            position: fixed;
            bottom: 40px; left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(26, 26, 26, 0.9);
            backdrop-filter: blur(10px);
            color: white;
            padding: 14px 28px;
            border-radius: 50px;
            font-size: 14px; font-weight: 600;
            display: flex; align-items: center; gap: 10px;
            z-index: 5000;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

    </style>
</head>
<body>

    <nav class="nav-bar">
        <a href="javascript:history.back()" class="back-link">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div class="nav-title">Notifications</div>
    </nav>

    <main class="feed-container">
        <div class="feed-top">
            <h2>Inbox</h2>
            <div class="wipe-btn" onclick="clearAll()">
                <i class="fa-solid fa-broom" style="margin-right: 5px;"></i> Wipe
            </div>
        </div>

        <div id="loader" class="skeleton-wrapper">
            <div class="skeleton-card">
                <div class="skeleton-icon"></div>
                <div class="skeleton-content">
                    <div class="skeleton-line"></div>
                    <div class="skeleton-line short"></div>
                </div>
            </div>
            <div class="skeleton-card">
                <div class="skeleton-icon"></div>
                <div class="skeleton-content">
                    <div class="skeleton-line"></div>
                    <div class="skeleton-line short"></div>
                </div>
            </div>
        </div>
        
        <div id="notif-list"></div>

        <div id="empty-state" class="empty-box">
            <i class="fa-solid fa-box-open"></i>
            <h3>You're all caught up!</h3>
        </div>
    </main>

    <div id="toast">
        <i class="fa-solid fa-circle-check" style="color: var(--brand-gold);"></i>
        <span id="toast-msg">Action Completed</span>
    </div>

    <script>
        // ==========================================================================
        // 1. FIREBASE INITIALIZATION
        // ==========================================================================
        const firebaseConfig = {
            databaseURL: "https://nemi-mart-2-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ==========================================================================
        // 2. CORE LOGIC & DOM MANIPULATION
        // ==========================================================================
        function fetchUpdates() {
            const list = document.getElementById('notif-list');
            const loader = document.getElementById('loader');
            const empty = document.getElementById('empty-state');

            db.ref('notifications').on('value', (snap) => {
                // Smooth hide loader
                loader.style.display = 'none';
                list.innerHTML = '';
                const data = snap.val();

                if (!data) {
                    empty.style.display = 'block';
                    return;
                }

                empty.style.display = 'none';
                const keys = Object.keys(data).reverse();

                keys.forEach((key, i) => {
                    const item = data[key];
                    const card = document.createElement('div');
                    card.className = 'card-item';
                    card.style.animationDelay = (i * 0.08) + 's'; // Staggered Animation
                    
                    // Dynamic Icon Logic based on Type
                    let mainIcon = 'fa-tag';
                    if(item.type === 'order') mainIcon = 'fa-box';
                    if(item.type === 'new') mainIcon = 'fa-wand-magic-sparkles';
                    if(item.type === 'alert') mainIcon = 'fa-bell';

                    card.innerHTML = `
                        <div class="orbit-container">
                            <div class="orbit-line"></div>
                            <div class="mini-product p1"><i class="fa-solid fa-shirt"></i></div>
                            <div class="mini-product p2"><i class="fa-solid fa-mobile-screen"></i></div>
                            <div class="mini-product p3"><i class="fa-solid fa-bag-shopping"></i></div>
                            <div class="main-icon">
                                <i class="fa-solid ${mainIcon}"></i>
                            </div>
                        </div>
                        <div class="card-content">
                            <h3>${item.title || 'Nemi Mart Exclusive'}</h3>
                            <p>${item.message || 'Tap to explore the latest updates from your premium feed.'}</p>
                            <div class="card-meta">
                                <span class="time-badge">
                                    <i class="fa-regular fa-clock"></i>
                                    ${getRelativeTime(item.timestamp)}
                                </span>
                                <button class="bin-btn" onclick="deleteItem(event, '${key}')" title="Delete">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                        </div>
                    `;
                    list.appendChild(card);
                });
            });
        }

        // ==========================================================================
        // 3. UTILITY FUNCTIONS
        // ==========================================================================
        function getRelativeTime(ts) {
            if(!ts) return "Just Now";
            const s = Math.floor((Date.now() - ts) / 1000);
            if(s < 60) return "Just now";
            if(s < 3600) return Math.floor(s/60) + "m ago";
            if(s < 86400) return Math.floor(s/3600) + "h ago";
            return new Date(ts).toLocaleDateString();
        }

        function deleteItem(event, id) {
            event.stopPropagation(); // Prevent card click if you add links later
            const btn = event.currentTarget;
            const card = btn.closest('.card-item');
            
            // Add exit animation class
            card.style.transform = 'scale(0.9) translateY(20px)';
            card.style.opacity = '0';
            
            setTimeout(() => {
                db.ref('notifications/' + id).remove().then(() => showToast("Notification removed"));
            }, 300); // Wait for CSS animation
        }

        function clearAll() {
            if(confirm("Are you sure you want to clear your entire inbox?")) {
                const list = document.getElementById('notif-list');
                list.style.opacity = '0.5';
                list.style.transform = 'scale(0.95)';
                list.style.transition = 'all 0.4s ease';
                
                setTimeout(() => {
                    db.ref('notifications').remove().then(() => {
                        list.style.opacity = '1';
                        list.style.transform = 'scale(1)';
                        showToast("Inbox cleared successfully");
                    });
                }, 400);
            }
        }

        // Modern Toast Controller
        let toastTimeout;
        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            
            toastMsg.innerText = msg;
            toast.classList.add('show');
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Boot Application
        window.onload = fetchUpdates;
    </script>
</body>
</html>
