 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Nemi Mart | Premium Ayurveda</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --creme: #FFFDF5;
            --gold: #D4AF37;
            --gold-light: #F3E5AB;
            --dark-green: #1B3022;
            --leaf-green: #2D5A27;
            --leaf-light: #eaf2e9;
            --white: #ffffff;
            --text-dark: #1f2e1c;
            --text-muted: #6b7b6b;
            --soft-shadow: 0 12px 28px rgba(0,0,0,0.04);
            --card-shadow: 0 20px 40px -8px rgba(27,48,34,0.12);
            --hover-shadow: 0 30px 55px -10px rgba(212,175,55,0.25);
            --transition: all 0.45s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--creme); color: var(--text-dark); padding-bottom: 110px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f0efe7; }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 12px; }

        header { 
            background: rgba(20, 40, 25, 0.96); 
            backdrop-filter: blur(20px);
            padding: 14px 5% 10px; 
            position: sticky; top: 0; z-index: 1200; 
            border-bottom: 2px solid var(--gold);
        }
        .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .logo-area { position: relative; width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; text-decoration: none; }
        .main-logo { width: 44px; filter: drop-shadow(0 4px 10px rgba(212,175,55,0.5)); }
        .orbit-icons { position: absolute; width: 100%; height: 100%; animation: spinGlow 18s infinite linear; }
        .orbit-icons i { position: absolute; font-size: 10px; color: var(--gold); opacity: 0.8; }
        .oi1 { top: 0; left: 50%; transform: translateX(-50%); } 
        .oi2 { bottom: 0; left: 50%; transform: translateX(-50%); } 
        .oi3 { left: 0; top: 50%; transform: translateY(-50%); } 
        .oi4 { right: 0; top: 50%; transform: translateY(-50%); }
        @keyframes spinGlow { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .address-box { flex: 1; margin-left: 14px; color: #fff; cursor: pointer; }
        .address-box p { font-size: 10px; opacity: 0.7; letter-spacing: 1.2px; }
        .address-box h4 { font-size: 13px; font-weight: 600; color: var(--gold); display: flex; align-items: center; gap: 5px; }

        .top-actions { display: flex; gap: 20px; font-size: 20px; }
        .top-actions a { color: white; transition: var(--transition); }
        .top-actions a:hover { color: var(--gold); transform: scale(1.1); }

        .search-fake-input { 
            background: white; border-radius: 18px; height: 48px; display: flex; align-items: center; 
            padding: 0 18px; color: #7a7a7a; font-size: 13px; box-shadow: inset 0 2px 10px rgba(0,0,0,0.02), 0 4px 10px rgba(0,0,0,0.03);
            border: 1px solid rgba(212,175,55,0.2);
        }

        .cat-strip { 
            display: flex; overflow-x: auto; padding: 22px 5% 16px; gap: 18px; background: white; 
            border-bottom: 1px solid rgba(0,0,0,0.02);
            scrollbar-width: none;
        }
        .cat-strip::-webkit-scrollbar { display: none; }
        .cat-card { text-align: center; min-width: 78px; text-decoration: none; color: var(--dark-green); transition: var(--transition); cursor: pointer; }
        .icon-circle { 
            width: 68px; height: 68px; background: var(--leaf-light); border-radius: 24px; 
            display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; 
            box-shadow: var(--soft-shadow); transition: var(--transition);
        }
        .cat-card:hover .icon-circle { transform: translateY(-6px); background: var(--dark-green); color: var(--gold); }
        .cat-card span { font-size: 11px; font-weight: 700; letter-spacing: 0.3px; }

        .banner-wrapper { margin: 24px 5%; border-radius: 28px; overflow: hidden; box-shadow: var(--card-shadow); border: 1px solid rgba(212,175,55,0.3); }
        .banner-container { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; scrollbar-width: none; }
        .banner-container::-webkit-scrollbar { display: none; }
        .banner-slide { min-width: 100%; scroll-snap-align: start; }
        .banner-slide img { width: 100%; height: auto; aspect-ratio: 1200 / 600; object-fit: cover; display: block; transition: transform 0.6s; }
        .banner-slide:hover img { transform: scale(1.01); }
        .banner-dots { display: flex; justify-content: center; gap: 10px; padding: 12px 0; background: white; }
        .dot { width: 8px; height: 8px; border-radius: 20px; background: #ccc; transition: 0.3s; cursor: pointer; }
        .dot.active { background: var(--gold); width: 28px; }

        .section-header { display: flex; justify-content: space-between; align-items: baseline; padding: 35px 5% 12px; }
        .section-header h2 { font-size: 22px; color: var(--dark-green); font-weight: 800; display: flex; align-items: center; gap: 8px; }
        .section-header h2 i { color: var(--gold); }

        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; padding: 0 5%; }

        .p-card { 
            background: white; border-radius: 24px; padding: 14px 12px 16px; box-shadow: var(--soft-shadow); 
            transition: var(--transition); border: 1px solid rgba(0,0,0,0.02);
            display: flex; flex-direction: column; cursor: pointer; position: relative;
        }
        .p-card:hover { transform: translateY(-8px); border-color: var(--gold); box-shadow: var(--hover-shadow); }

        .p-img-box { width: 100%; aspect-ratio: 1/1; background: #fafaf6; border-radius: 18px; margin-bottom: 14px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .p-img-box img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .p-card:hover .p-img-box img { transform: scale(1.08); }

        .premium-badge { position: absolute; top: 12px; right: 12px; background: var(--gold); color: var(--dark-green); font-size: 9px; font-weight: 800; padding: 4px 8px; border-radius: 30px; z-index: 2; }
        .discount-badge { position: absolute; top: 12px; left: 12px; background: #c44536; color: white; font-size: 9px; font-weight: 800; padding: 4px 9px; border-radius: 30px; z-index: 2; }

        .p-tag { font-size: 9px; font-weight: 800; color: var(--gold); text-transform: uppercase; margin-bottom: 6px; }
        .p-title { font-size: 14px; font-weight: 700; color: var(--dark-green); line-height: 1.4; height: 38px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; margin-bottom: 8px; }

        .p-price-row { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
        .p-price { color: var(--leaf-green); font-weight: 800; font-size: 17px; }
        .p-old-price { font-size: 11px; color: var(--text-muted); text-decoration: line-through; margin-left: 4px; }

        .add-btn { 
            background: var(--dark-green); color: white; border: none; width: 40px; height: 40px; border-radius: 14px; 
            display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s;
            box-shadow: 0 6px 12px rgba(0,0,0,0.08);
        }
        .add-btn:hover { background: var(--gold); color: #1b3022; }
        .add-btn.added { background: #3c6e47; }

        .bottom-nav { 
            position: fixed; bottom: 0; width: 100%; background: rgba(255,255,255,0.96); backdrop-filter: blur(12px);
            display: flex; justify-content: space-around; padding: 10px 0 26px; box-shadow: 0 -12px 30px rgba(0,0,0,0.05); 
            border-radius: 28px 28px 0 0; z-index: 2000;
        }
        .nav-item { text-align: center; text-decoration: none; color: #7d8f7d; font-size: 10px; font-weight: 500; flex: 1; }
        .nav-item i { font-size: 22px; display: block; margin-bottom: 4px; }
        .nav-item.active { color: var(--leaf-green); }
        .nav-item.active i { color: var(--gold); }

        .cart-float { margin-top: -58px; }
        .cart-circle { 
            width: 70px; height: 70px; background: var(--leaf-green); border: 7px solid var(--creme); 
            border-radius: 40px; display: flex; align-items: center; justify-content: center; color: white; 
            box-shadow: 0 14px 25px rgba(45,90,39,0.35); transition: 0.3s;
        }
        .cart-circle:hover { background: var(--gold); }
        .badge { position: absolute; top: 2px; right: 2px; background: #d93838; color: white; font-size: 11px; min-width: 22px; height: 22px; border-radius: 30px; border: 2px solid white; display: flex; align-items: center; justify-content: center; font-weight: 800; }

        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 10000; width: 86%; pointer-events: none; }
        .toast { background: #1e3b28; color: white; padding: 14px 22px; border-radius: 40px; margin-bottom: 10px; border-left: 6px solid var(--gold); box-shadow: 0 15px 30px rgba(0,0,0,0.2); animation: slideDown 0.3s; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: translateY(0); } }

        .empty-state { grid-column: span 2; text-align: center; padding: 50px 20px; color: var(--text-muted); }
        .global-loader { display: flex; justify-content: center; padding: 40px; grid-column: span 2; }
        .spinner { width: 44px; height: 44px; border: 4px solid rgba(212,175,55,0.2); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.9s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="toast-container"></div>

<header>
    <div class="header-top">
        <a href="index.html" class="logo-area">
            <div class="orbit-icons">
                <i class="fas fa-leaf oi1"></i><i class="fas fa-plus oi2"></i>
                <i class="fas fa-star oi3"></i><i class="fas fa-heart oi4"></i>
            </div>
            <img src="https://raw.githubusercontent.com/nemimart/The-Nemi-Mart/main/logo.png" class="main-logo" alt="Nemi Logo">
        </a>
        <div class="address-box" onclick="window.location.href='address.html'">
            <p>Deliver to</p>
            <h4 id="displayLocation">Akash, Patiala 147001 <i class="fas fa-chevron-down"></i></h4>
        </div>
        <div class="top-actions">
            <a href="heart.html"><i class="far fa-heart"></i></a>
            <a href="profile.html"><i class="far fa-user-circle"></i></a>
        </div>
    </div>
    <div class="search-container" onclick="window.location.href='search.html'">
        <div class="search-fake-input">
            <i class="fas fa-search" style="margin-right: 14px; color: var(--gold);"></i>
            Search pure Ayurveda...
        </div>
    </div>
</header>

<div class="cat-strip" id="categoryContainer"></div>

<div class="banner-wrapper">
    <div class="banner-container" id="bannerContainer"></div>
    <div class="banner-dots" id="bannerDots"></div>
</div>

<div class="section-header">
    <h2><i class="fas fa-fire"></i> Top Selling</h2>
    <a href="allproduct.html" style="color: var(--leaf-green); font-size: 12px; font-weight: 600;">View All</a>
</div>
<div class="product-grid" id="topSellingGrid"></div>

<div class="section-header">
    <h2><i class="fas fa-crown"></i> Premium Range</h2>
</div>
<div class="product-grid" id="premiumGrid"></div>

<div class="section-header">
    <h2><i class="fas fa-box-open"></i> All Products</h2>
</div>
<div class="product-grid" id="allProductsGrid"></div>

<footer style="background: #1b3022; padding: 40px 5% 130px; color: white; text-align: center; margin-top: 40px;">
    <img src="https://raw.githubusercontent.com/nemimart/The-Nemi-Mart/main/logo.png" style="width: 70px; margin-bottom: 15px;">
    <h3 style="color: var(--gold);">The Nemi Mart</h3>
    <p style="font-size: 13px; opacity: 0.75;">Ayurveda • Purity • Tradition</p>
    <p style="margin-top: 20px; font-size: 11px; opacity: 0.4;">&copy; 2026 Arham Insights</p>
</footer>

<nav class="bottom-nav">
    <a href="index.html" class="nav-item active"><i class="fas fa-home-alt"></i>Home</a>
    <a href="allproduct.html" class="nav-item"><i class="fas fa-store"></i>Shop</a>
    <div class="cart-float">
        <a href="cart.html">
            <div class="cart-circle">
                <i class="fas fa-shopping-basket"></i>
                <div class="badge" id="cartBadge">0</div>
            </div>
        </a>
    </div>
    <a href="notifications.html" class="nav-item"><i class="fas fa-bell"></i>Alerts</a>
    <a href="orders.html" class="nav-item"><i class="fas fa-box-open"></i>Orders</a>
</nav>

<script>
    (function(){
        "use strict";

        // FIREBASE CONFIG
        const firebaseConfig = {
            databaseURL: "https://nemi-mart-2-default-rtdb.firebaseio.com"
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const CART_KEY = 'nemi_cart';
        
        // 4 BANNERS
        const BANNER_IMAGES = [
            "https://res.cloudinary.com/despxo7zb/image/upload/v1/samples/food/spices",
            "https://res.cloudinary.com/despxo7zb/image/upload/v1/samples/landscapes/nature-mountains",
            "https://res.cloudinary.com/despxo7zb/image/upload/v1/samples/people/boy-snow-hoodie",
            "https://res.cloudinary.com/despxo7zb/image/upload/v1/samples/animals/three-dogs"
        ];
        
        const DEFAULT_CATEGORIES = [
            { id: "cat1", name: "Immunity", icon: "fa-shield-heart" },
            { id: "cat2", name: "Hair Care", icon: "fa-pump-soap" },
            { id: "cat3", name: "Vitality", icon: "fa-bolt" },
            { id: "cat4", name: "Wellness", icon: "fa-mortar-pestle" },
            { id: "cat5", name: "Skin", icon: "fa-spa" }
        ];

        let masterProducts = [];
        let categories = [];

        const topGrid = document.getElementById('topSellingGrid');
        const premGrid = document.getElementById('premiumGrid');
        const allGrid = document.getElementById('allProductsGrid');
        const catContainer = document.getElementById('categoryContainer');
        const cartBadge = document.getElementById('cartBadge');

        // INIT BANNERS
        function initBanners() {
            const container = document.getElementById('bannerContainer');
            const dotsDiv = document.getElementById('bannerDots');
            container.innerHTML = BANNER_IMAGES.map(url => `<div class="banner-slide"><img src="${url}" alt="banner"></div>`).join('');
            dotsDiv.innerHTML = BANNER_IMAGES.map((_, i) => `<span class="dot ${i===0?'active':''}" data-index="${i}"></span>`).join('');
            
            const dots = dotsDiv.querySelectorAll('.dot');
            container.addEventListener('scroll', () => {
                const idx = Math.round(container.scrollLeft / container.clientWidth);
                dots.forEach((d, i) => d.classList.toggle('active', i === idx));
            });
            dots.forEach(dot => dot.addEventListener('click', (e) => {
                container.scrollTo({ left: container.clientWidth * parseInt(e.target.dataset.index), behavior: 'smooth' });
            }));
            
            setInterval(() => {
                if (!container) return;
                const w = container.clientWidth;
                const next = (Math.round(container.scrollLeft / w) + 1) % BANNER_IMAGES.length;
                container.scrollTo({ left: next * w, behavior: 'smooth' });
            }, 4500);
        }

        // FETCH FROM FIREBASE
        function fetchProducts() {
            [topGrid, premGrid, allGrid].forEach(g => g.innerHTML = '<div class="global-loader"><div class="spinner"></div></div>');
            
            database.ref('products').on('value', (snap) => {
                const data = snap.val();
                masterProducts = [];
                
                if (data) {
                    Object.keys(data).forEach(key => {
                        const p = data[key];
                        // FIX: title aur name dono support karo
                        const productName = p.title || p.name || "Untitled Product";
                        const productImage = p.images?.[0] || p.img || p.image || p.cloudinaryUrl || "https://raw.githubusercontent.com/nemimart/The-Nemi-Mart/main/logo.png";
                        const finalPrice = p.finalPrice || p.price || 0;
                        const originalPrice = p.price || finalPrice;
                        const discountPercent = p.discount || (originalPrice > finalPrice ? Math.round((1 - finalPrice/originalPrice)*100) : 0);
                        
                        masterProducts.push({
                            id: key,
                            name: productName,
                            title: productName,
                            category: p.category || "Ayurveda",
                            price: originalPrice,
                            finalPrice: finalPrice,
                            discount: discountPercent,
                            img: productImage,
                            images: p.images || [productImage],
                            stock: p.stock || 0,
                            isPremium: p.isPremium || p.premium || false,
                            isTopSelling: p.isTopSelling || p.topSelling || false,
                            hero: p.hero || "",
                            description: p.description || "",
                            status: p.status || "INSTOCK"
                        });
                    });
                }
                
                database.ref('categories').once('value').then(catSnap => {
                    categories = catSnap.val() ? Object.values(catSnap.val()) : DEFAULT_CATEGORIES;
                    renderCategories();
                }).catch(() => {
                    categories = DEFAULT_CATEGORIES;
                    renderCategories();
                });
                
                renderAllSections();
                updateCartBadge();
            });
        }

        function renderCategories() {
            catContainer.innerHTML = categories.map(cat => `
                <div class="cat-card" onclick="window.location.href='allproduct.html?cat=${encodeURIComponent(cat.name)}'">
                    <div class="icon-circle"><i class="fas ${cat.icon}"></i></div>
                    <span>${cat.name}</span>
                </div>
            `).join('');
        }

        function renderAllSections() {
            if (!masterProducts.length) {
                const emptyMsg = '<div class="empty-state"><i class="fas fa-leaf" style="font-size:32px;opacity:0.4"></i><p>Add products via Admin Panel!</p></div>';
                topGrid.innerHTML = emptyMsg;
                premGrid.innerHTML = emptyMsg;
                allGrid.innerHTML = emptyMsg;
                return;
            }

            const inStockProducts = masterProducts.filter(p => p.stock > 0);
            const topItems = inStockProducts.filter(p => p.isTopSelling).slice(0, 6);
            const premiumItems = inStockProducts.filter(p => p.isPremium).slice(0, 6);
            
            topGrid.innerHTML = buildGrid(topItems.length ? topItems : inStockProducts.slice(0, 4));
            premGrid.innerHTML = buildGrid(premiumItems.length ? premiumItems : inStockProducts.filter(p => p.price >= 500).slice(0, 4));
            allGrid.innerHTML = buildGrid(inStockProducts);
        }

        function buildGrid(items) {
            if (!items.length) return '<div class="empty-state">✨ Coming soon</div>';
            return items.map(p => createProductCard(p)).join('');
        }

        function createProductCard(p) {
            const cart = JSON.parse(localStorage.getItem(CART_KEY)) || [];
            const inCart = cart.some(item => item.id === p.id);
            
            return `
                <div class="p-card" onclick="window.location.href='product.html?id=${p.id}'">
                    ${p.isPremium ? '<div class="premium-badge"><i class="fas fa-crown"></i> PREMIUM</div>' : ''}
                    ${p.discount > 0 ? `<div class="discount-badge">${p.discount}% OFF</div>` : ''}
                    <div class="p-img-box">
                        <img src="${p.img}" alt="${p.name}" onerror="this.src='https://raw.githubusercontent.com/nemimart/The-Nemi-Mart/main/logo.png'">
                    </div>
                    <span class="p-tag">${p.category}</span>
                    <div class="p-title">${p.name}</div>
                    <div class="p-price-row">
                        <div class="p-price">₹${p.finalPrice || p.price} ${p.discount > 0 ? `<span class="p-old-price">₹${p.price}</span>` : ''}</div>
                        <button class="add-btn ${inCart ? 'added' : ''}" onclick="window.handleAddToCart(event, '${p.id}')">
                            <i class="fas ${inCart ? 'fa-check' : 'fa-plus'}"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        window.handleAddToCart = function(e, id) {
            e.stopPropagation();
            let cart = JSON.parse(localStorage.getItem(CART_KEY)) || [];
            const product = masterProducts.find(p => p.id === id);
            if (!product) return;
            
            if (!cart.some(item => item.id === id)) {
                cart.push({ ...product, qty: 1 });
                localStorage.setItem(CART_KEY, JSON.stringify(cart));
                showToast('🛒 Added!', `${product.name} in cart`);
                updateCartBadge();
                e.currentTarget.classList.add('added');
                e.currentTarget.innerHTML = '<i class="fas fa-check"></i>';
            } else {
                showToast('Info', 'Already in cart');
            }
        };

        function updateCartBadge() {
            const cart = JSON.parse(localStorage.getItem(CART_KEY)) || [];
            cartBadge.innerText = cart.length;
        }

        function showToast(title, msg) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<strong>${title}</strong> ${msg}`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 2800);
        }

        // INIT
        initBanners();
        fetchProducts();
        updateCartBadge();
        
        window.addEventListener('storage', (e) => {
            if (e.key === CART_KEY) updateCartBadge();
        });
    })();
</script>
</body>
</html>
