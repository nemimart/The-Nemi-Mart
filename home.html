 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Nemi Mart | Premium Ayurveda</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        /* ==========================================================================
           1. CSS VARIABLES & BASE THEME (ENTERPRISE LEVEL)
           ========================================================================== */
        :root {
            --creme: #FFFDF5;
            --gold: #D4AF37;
            --gold-light: #F3E5AB;
            --dark-green: #1B3022;
            --leaf-green: #2D5A27;
            --leaf-light: #eaf2e9;
            --white: #ffffff;
            --text-dark: #2C3E2D;
            --text-muted: #888888;
            --soft-shadow: 0 10px 40px rgba(0,0,0,0.06);
            --card-shadow: 0 15px 35px rgba(27,48,34,0.08);
            --hover-shadow: 0 20px 50px rgba(212,175,55,0.2);
            --inner-shadow: inset 0 2px 10px rgba(0,0,0,0.05);
            --transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            --skeleton-bg: #f0f0f0;
            --skeleton-shine: #e0e0e0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--creme); color: var(--text-dark); padding-bottom: 120px; overflow-x: hidden; line-height: 1.6; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--creme); }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }

        /* ==========================================================================
           2. HEADER & NAVIGATION
           ========================================================================== */
        header { 
            background: rgba(27, 48, 34, 0.98); 
            backdrop-filter: blur(15px);
            padding: 15px 5%; 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            box-shadow: 0 4px 30px rgba(0,0,0,0.2); 
            border-bottom: 2px solid var(--gold);
        }
        .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        
        .logo-area { position: relative; width: 60px; height: 60px; display: flex; justify-content: center; align-items: center; text-decoration: none; transition: var(--transition); }
        .logo-area:hover { transform: scale(1.08) rotate(5deg); }
        .main-logo { width: 45px; z-index: 5; position: relative; filter: drop-shadow(0 0 10px rgba(212,175,55,0.6)); }
        
        .orbit-icons { position: absolute; width: 100%; height: 100%; animation: rotateFull 12s linear infinite; }
        .orbit-icons i { position: absolute; font-size: 10px; color: var(--gold); opacity: 0.8; }
        .oi1 { top: 0; left: 50%; transform: translateX(-50%); } 
        .oi2 { bottom: 0; left: 50%; transform: translateX(-50%); } 
        .oi3 { left: 0; top: 50%; transform: translateY(-50%); } 
        .oi4 { right: 0; top: 50%; transform: translateY(-50%); }
        @keyframes rotateFull { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* Auto Location Box */
        .address-box { flex: 1; margin-left: 20px; color: white; transition: var(--transition); display: flex; flex-direction: column; justify-content: center; }
        .address-box p { font-size: 11px; opacity: 0.7; letter-spacing: 1px; text-transform: uppercase; margin-bottom: -2px; display: flex; align-items: center; gap: 5px; }
        .address-box h4 { font-size: 14px; font-weight: 600; color: var(--gold); display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
        .loc-loader { width: 12px; height: 12px; border: 2px solid rgba(255,255,255,0.3); border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .top-actions { display: flex; gap: 20px; font-size: 22px; }
        .top-actions a { color: white; transition: var(--transition); cursor: pointer; position: relative; }
        .top-actions a:hover { color: var(--gold); transform: translateY(-3px); }

        .search-container { position: relative; max-width: 800px; margin: 5px auto 0; cursor: pointer; }
        .search-fake-input { 
            background: white; border-radius: 20px; height: 50px; display: flex; align-items: center; 
            padding: 0 20px; color: var(--text-muted); font-size: 14px; box-shadow: var(--inner-shadow); 
            transition: var(--transition); border: 2px solid transparent; 
        }
        .search-fake-input:hover { border-color: var(--gold); box-shadow: 0 5px 20px rgba(212,175,55,0.2); transform: translateY(-2px); }

        /* ==========================================================================
           3. CATEGORY STRIP
           ========================================================================== */
        .cat-strip { 
            display: flex; overflow-x: auto; padding: 35px 5%; gap: 25px; 
            background: white; scrollbar-width: none; border-bottom: 1px solid rgba(0,0,0,0.05);
            box-shadow: 0 10px 20px rgba(0,0,0,0.02);
        }
        .cat-strip::-webkit-scrollbar { display: none; }
        .cat-card { text-align: center; min-width: 85px; text-decoration: none; color: var(--dark-green); transition: var(--transition); cursor: pointer; }
        
        .icon-circle { 
            width: 75px; height: 75px; background: var(--leaf-light); border-radius: 24px; 
            display: flex; justify-content: center; align-items: center; margin: 0 auto 12px; 
            border: 2px solid transparent; transition: var(--transition); box-shadow: var(--soft-shadow);
        }
        .cat-card:hover .icon-circle { transform: translateY(-10px) rotate(8deg); background: var(--dark-green); border-color: var(--gold); box-shadow: var(--hover-shadow); }
        .cat-card:hover i { color: var(--gold); transform: scale(1.1); }
        .cat-card:hover span { color: var(--leaf-green); font-weight: 700; }
        .cat-card i { font-size: 30px; color: var(--leaf-green); transition: 0.4s; }
        .cat-card span { font-size: 13px; font-weight: 600; display: block; transition: 0.3s; }

        /* ==========================================================================
           4. AUTO-SCROLLING BANNER CAROUSEL
           ========================================================================== */
        .banner-wrapper { 
            position: relative; margin: 30px auto; width: 95%; max-width: 1200px; 
            border-radius: 30px; box-shadow: var(--card-shadow); border: 2px solid rgba(212,175,55,0.2);
            overflow: hidden; background: white;
        }
        .carousel-track { display: flex; transition: transform 0.6s ease-in-out; height: 100%; }
        .carousel-slide { min-width: 100%; position: relative; }
        .carousel-slide img { width: 100%; aspect-ratio: 16/7; object-fit: cover; display: block; border-radius: 28px; }
        
        /* Carousel Indicators */
        .carousel-indicators { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 10; }
        .indicator { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.5); cursor: pointer; transition: var(--transition); }
        .indicator.active { background: var(--gold); transform: scale(1.3); }

        /* ==========================================================================
           5. PRODUCT SECTIONS & GRIDS
           ========================================================================== */
        .section-header { display: flex; justify-content: space-between; align-items: center; padding: 45px 5% 20px; max-width: 1200px; margin: 0 auto; }
        .section-header h2 { font-size: 22px; color: var(--dark-green); font-weight: 800; display: flex; align-items: center; gap: 10px; }
        .section-header h2 i { color: var(--gold); font-size: 20px; }
        
        .view-all { 
            text-decoration: none; color: var(--leaf-green); font-size: 13px; font-weight: 600; 
            background: var(--leaf-light); padding: 8px 18px; border-radius: 12px; transition: var(--transition); cursor: pointer; 
        }
        .view-all:hover { background: var(--dark-green); color: var(--gold); border-color: var(--gold); transform: translateY(-2px); }

        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 0 5%; max-width: 1200px; margin: 0 auto; min-height: 200px; }
        @media (min-width: 768px) { .product-grid { grid-template-columns: repeat(3, 1fr); gap: 20px; } }
        @media (min-width: 1024px) { .product-grid { grid-template-columns: repeat(4, 1fr); gap: 25px; } }

        /* ==========================================================================
           6. PREMIUM PRODUCT CARDS (Hover Effects & Styling)
           ========================================================================== */
        .p-card { 
            background: white; border-radius: 24px; padding: 15px; box-shadow: var(--soft-shadow); 
            transition: var(--transition); border: 1px solid rgba(0,0,0,0.03); display: flex; 
            flex-direction: column; position: relative; overflow: hidden; cursor: pointer; 
            animation: fadeInUp 0.6s ease forwards;
        }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        
        .p-card:hover { transform: translateY(-8px); border-color: var(--gold); box-shadow: var(--hover-shadow); z-index: 2; }
        .p-card:hover .p-img-box { background: var(--leaf-light); }

        .p-img-box { 
            width: 100%; aspect-ratio: 1/1; background: #f9f9f9; border-radius: 18px; margin-bottom: 12px; 
            display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative;
            transition: var(--transition);
        }
        .p-img-box img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s cubic-bezier(0.165, 0.84, 0.44, 1); }
        .p-card:hover .p-img-box img { transform: scale(1.08); }

        .discount-badge { position: absolute; top: 10px; left: 10px; background: #ff4757; color: white; font-size: 10px; font-weight: 700; padding: 4px 8px; border-radius: 8px; z-index: 2; box-shadow: 0 4px 10px rgba(255,71,87,0.3); }
        
        .p-info { flex-grow: 1; display: flex; flex-direction: column; }
        .p-tag { font-size: 10px; font-weight: 700; color: var(--gold); text-transform: uppercase; margin-bottom: 4px; letter-spacing: 0.5px; }
        .p-title { font-size: 14px; font-weight: 600; color: var(--dark-green); line-height: 1.3; margin-bottom: 5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .p-desc { font-size: 11px; color: var(--text-muted); margin-bottom: 15px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
        
        .p-price-row { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 10px; border-top: 1px dashed rgba(0,0,0,0.05); }
        .p-price { color: var(--leaf-green); font-weight: 800; font-size: 18px; display: flex; flex-direction: column; line-height: 1.1; }
        .p-old-price { font-size: 11px; color: var(--text-muted); text-decoration: line-through; font-weight: 500; margin-top: 2px; }
        
        .add-btn { 
            background: var(--dark-green); color: white; border: none; width: 40px; height: 40px; 
            border-radius: 12px; cursor: pointer; transition: var(--transition); box-shadow: 0 4px 10px rgba(27,48,34,0.2);
            display: flex; justify-content: center; align-items: center; font-size: 16px;
        }
        .add-btn:hover { background: var(--gold); transform: scale(1.1) rotate(5deg); }
        .add-btn.added { background: var(--leaf-green); pointer-events: none; }

        /* ==========================================================================
           7. SKELETON LOADERS & TOASTS
           ========================================================================== */
        .skeleton-card { background: white; border-radius: 24px; padding: 15px; height: 300px; display: flex; flex-direction: column; gap: 10px; }
        .skel-img { width: 100%; aspect-ratio: 1/1; border-radius: 18px; background: linear-gradient(90deg, var(--skeleton-bg) 25%, var(--skeleton-shine) 50%, var(--skeleton-bg) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
        .skel-line { height: 15px; border-radius: 8px; background: linear-gradient(90deg, var(--skeleton-bg) 25%, var(--skeleton-shine) 50%, var(--skeleton-bg) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
        .skel-line.short { width: 60%; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 15px; width: 90%; max-width: 400px; pointer-events: none; }
        .nemi-toast { background: var(--dark-green); color: white; padding: 16px 22px; border-radius: 18px; display: flex; align-items: center; gap: 15px; border: 1px solid var(--gold); box-shadow: 0 10px 30px rgba(0,0,0,0.3); animation: toastEnter 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes toastEnter { from { opacity: 0; transform: translateY(-30px) scale(0.9); } to { opacity: 1; transform: translateY(0) scale(1); } }

        .empty-state { grid-column: 1 / -1; text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 14px; background: white; border-radius: 24px; border: 1px dashed #ccc; }
        .empty-state i { font-size: 40px; color: var(--leaf-light); margin-bottom: 10px; }

        /* ==========================================================================
           8. BOTTOM NAVIGATION
           ========================================================================== */
        .bottom-nav { 
            position: fixed; bottom: 0; width: 100%; background: white; display: flex; 
            justify-content: space-around; align-items: center; padding: 12px 0 15px; 
            box-shadow: 0 -10px 30px rgba(0,0,0,0.08); border-radius: 30px 30px 0 0; z-index: 2000; 
        }
        .nav-item { text-align: center; text-decoration: none; color: #a0a0a0; font-size: 11px; font-weight: 600; flex: 1; transition: var(--transition); }
        .nav-item i { font-size: 22px; display: block; margin-bottom: 5px; transition: transform 0.3s; }
        .nav-item:hover { color: var(--dark-green); }
        .nav-item:hover i { transform: translateY(-3px); }
        .nav-item.active { color: var(--leaf-green); }

        .cart-float { position: relative; margin-top: -65px; z-index: 2010; }
        .cart-circle { 
            width: 70px; height: 70px; background: var(--leaf-green); border: 7px solid var(--creme); 
            border-radius: 50%; display: flex; justify-content: center; align-items: center; 
            color: white; font-size: 24px; box-shadow: 0 15px 25px rgba(45,90,39,0.4); transition: var(--transition);
        }
        .cart-float:hover .cart-circle { transform: translateY(-5px); background: var(--dark-green); border-color: white; }
        .badge { position: absolute; top: 0px; right: 0px; background: #ff4757; color: white; font-size: 11px; width: 24px; height: 24px; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: 3px solid white; font-weight: 800; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
    </style>
</head>

    <script>
        // ==========================================
        // 1. CAROUSEL LOGIC (AUTO-SCROLL)
        // ==========================================
        const track = document.getElementById('carouselTrack');
        const dots = document.querySelectorAll('.indicator');
        let currentSlide = 0;
        const totalSlides = dots.length;

        function updateCarousel() {
            track.style.transform = `translateX(-${currentSlide * 100}%)`;
            dots.forEach(dot => dot.classList.remove('active'));
            dots[currentSlide].classList.add('active');
        }

        function goToSlide(index) {
            currentSlide = index;
            updateCarousel();
            resetTimer();
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % totalSlides;
            updateCarousel();
        }

        let slideTimer = setInterval(nextSlide, 3500); // Scrolls every 3.5 seconds

        function resetTimer() {
            clearInterval(slideTimer);
            slideTimer = setInterval(nextSlide, 3500);
        }


        // ==========================================
        // 2. GEOLOCATION (AUTO-ADDRESS FETCH)
        // ==========================================
        function getUserLocation() {
            const addressText = document.getElementById('userAddressText');
            
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        try {
                            // Using Free OpenStreetMap Nominatim API for Reverse Geocoding
                            const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                            const data = await response.json();
                            
                            const city = data.address.city || data.address.town || data.address.village || data.address.state_district || "Unknown Location";
                            const pincode = data.address.postcode || "";
                            
                            addressText.innerHTML = `${city} ${pincode ? '- ' + pincode : ''} <i class="fas fa-chevron-down" style="font-size:12px; margin-left:4px;"></i>`;
                        } catch (error) {
                            addressText.innerHTML = `Location detected <i class="fas fa-chevron-down"></i>`;
                        }
                    },
                    (error) => {
                        // Fallback location if permission denied
                        addressText.innerHTML = `Set Location Manually <i class="fas fa-chevron-down"></i>`;
                    }
                );
            } else {
                addressText.innerHTML = `Browser Not Supported`;
            }
        }
        
        // Trigger Geolocation on load
        getUserLocation();


        // ==========================================
        // 3. FIREBASE CONFIG (Nemi Mart 2)
        // ==========================================
        const firebaseConfig = {
            databaseURL: "https://nemi-mart-2-default-rtdb.firebaseio.com/"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();


        // ==========================================
        // 4. NOTIFICATION SYSTEM
        // ==========================================
        class NotificationSystem {
            static showToast(title, message) {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                toast.className = 'nemi-toast';
                toast.innerHTML = `
                    <div style="background: rgba(255,255,255,0.2); width:40px; height:40px; border-radius:50%; display:flex; justify-content:center; align-items:center;">
                        <i class="fas fa-check" style="color:var(--gold); font-size:18px;"></i>
                    </div>
                    <div class="toast-text">
                        <h4 style="font-size:15px; font-weight:600; margin-bottom:2px;">${title}</h4>
                        <p style="font-size:12px; opacity:0.9;">${message}</p>
                    </div>`;
                container.appendChild(toast);
                setTimeout(() => { 
                    toast.style.opacity = '0'; 
                    toast.style.transform = 'translateY(-20px)';
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }
        }


        // ==========================================
        // 5. CART ENGINE
        // ==========================================
        class CartEngine {
            constructor() {
                this.cartKey = 'nemi_mart_cart_v3';
                this.items = JSON.parse(localStorage.getItem(this.cartKey)) || [];
                this.updateBadge();
            }
            isProductInCart(productId) { return this.items.some(item => item.id === productId); }
            addItem(productStr, event, btnElement) {
                event.stopPropagation();
                const product = JSON.parse(decodeURIComponent(productStr));
                if (this.isProductInCart(product.id)) {
                    NotificationSystem.showToast("Already in Cart", "Checkout your shopping bag!");
                    return;
                }
                this.items.push({ ...product, qty: 1 });
                localStorage.setItem(this.cartKey, JSON.stringify(this.items));
                this.updateBadge();
                if (btnElement) {
                    btnElement.classList.add('added');
                    btnElement.innerHTML = '<i class="fas fa-check"></i>';
                }
                NotificationSystem.showToast("Added to Bag!", `${product.name} is ready.`);
            }
            updateBadge() {
                const badge = document.getElementById('cartBadge');
                if (badge) badge.innerText = this.items.length;
            }
        }
        const appCart = new CartEngine();


        // ==========================================
        // 6. UI RENDER ENGINE
        // ==========================================
        function createProductCardHTML(product) {
            // Safeguard & Encoding
            const safeProduct = {
                id: product.id || `prod_${Math.random()}`,
                name: product.name || 'Premium Ayurvedic Product',
                price: product.price || '0',
                oldPrice: product.oldPrice || '',
                tag: product.tag || 'Organic',
                desc: product.description || product.desc || 'Pure & natural wellness formulation.',
                // Handle Cloudinary or Firebase storage URLs (checking both 'image' and 'img' keys)
                image: product.image || product.img || 'https://via.placeholder.com/400x400?text=Ayurveda'
            };

            const productString = encodeURIComponent(JSON.stringify(safeProduct));
            const inCartClass = appCart.isProductInCart(safeProduct.id) ? 'added' : '';
            const inCartIcon = appCart.isProductInCart(safeProduct.id) ? '<i class="fas fa-check"></i>' : '<i class="fas fa-plus"></i>';
            
            // Calculate Discount Percentage automatically if old price exists
            let discountBadge = '';
            if(safeProduct.oldPrice && parseFloat(safeProduct.oldPrice) > parseFloat(safeProduct.price)) {
                let off = Math.round(((safeProduct.oldPrice - safeProduct.price) / safeProduct.oldPrice) * 100);
                discountBadge = `<div class="discount-badge">${off}% OFF</div>`;
            }

            return `
                <div class="p-card" onclick="window.location.href='product-detail.html?id=${safeProduct.id}'">
                    ${discountBadge}
                    <div class="p-img-box">
                        <img src="${safeProduct.image}" alt="${safeProduct.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/400x400?text=No+Image'">
                    </div>
                    <div class="p-info">
                        <div class="p-tag">${safeProduct.tag}</div>
                        <div class="p-title">${safeProduct.name}</div>
                        <div class="p-desc">${safeProduct.desc}</div>
                        <div class="p-price-row">
                            <div class="p-price">
                                ₹${safeProduct.price}
                                ${safeProduct.oldPrice ? `<span class="p-old-price">₹${safeProduct.oldPrice}</span>` : ''}
                            </div>
                            <button class="add-btn ${inCartClass}" onclick="appCart.addItem('${productString}', event, this)">
                                ${inCartIcon}
                            </button>
                        </div>
                    </div>
                </div>`;
        }


        // ==========================================
        // 7. FIREBASE DATA FETCHING & FILTERING
        // ==========================================
        function loadHomeProducts() {
            const productsRef = database.ref('products');
            
            productsRef.on('value', (snapshot) => {
                const data = snapshot.val();
                
                const topGrid = document.getElementById('topSellingGrid');
                const premiumGrid = document.getElementById('premiumGrid');
                const allGrid = document.getElementById('allProductsGrid');
                
                if (!data) {
                    const emptyHtml = '<div class="empty-state"><i class="fas fa-box-open"></i><br>No products available yet. Admin needs to add them.</div>';
                    topGrid.innerHTML = emptyHtml;
                    premiumGrid.innerHTML = emptyHtml;
                    allGrid.innerHTML = emptyHtml;
                    return;
                }

                // Clear Skeleton Loaders
                topGrid.innerHTML = '';
                premiumGrid.innerHTML = '';
                allGrid.innerHTML = '';

                // Convert Object to Array
                const productList = Object.keys(data).map(key => ({
                    id: key,
                    ...data[key]
                }));

                let topCount = 0;
                let premiumCount = 0;

                productList.forEach(prod => {
                    const cardHtml = createProductCardHTML(prod);
                    
                    // 1. Populate All Products Grid
                    allGrid.innerHTML += cardHtml;

                    // 2. Populate Top Selling Grid (Based on Admin Panel flag)
                    // Handling boolean true or string "true"
                    if(prod.isTopSelling === true || prod.isTopSelling === "true") {
                        topGrid.innerHTML += cardHtml;
                        topCount++;
                    }

                    // 3. Populate Premium Grid (Based on Admin Panel flag)
                    if(prod.isPremium === true || prod.isPremium === "true") {
                        premiumGrid.innerHTML += cardHtml;
                        premiumCount++;
                    }
                });

                // Fallback: If Admin hasn't marked any product as Top Selling/Premium, 
                // randomly show first few products so the design doesn't break
                if(topCount === 0 && productList.length > 0) {
                    productList.slice(0, 4).forEach(p => topGrid.innerHTML += createProductCardHTML(p));
                }
                if(premiumCount === 0 && productList.length > 0) {
                    // Show next batch for premium
                    productList.slice(-4).forEach(p => premiumGrid.innerHTML += createProductCardHTML(p));
                }

            }, (error) => {
                console.error("Database Connection Failed: ", error);
                document.getElementById('allProductsGrid').innerHTML = '<div class="empty-state">Network Error. Check your connection.</div>';
            });
        }

        // Initialize App Data Fetch
        window.onload = loadHomeProducts;

    </script>
