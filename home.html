 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Nemi Mart | Premium Ayurvedic Experience</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --primary: #1B3022;
            --accent: #D4AF37;
            --accent-light: #F3E5AB;
            --bg-creme: #FFFDF5;
            --white: #ffffff;
            --text-main: #2D2D2D;
            --text-light: #757575;
            --success: #2D5A27;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.05);
            --shadow-md: 0 12px 30px rgba(0,0,0,0.08);
            --shadow-lg: 0 20px 50px rgba(27,48,34,0.15);
            --transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }

        /* Base Setup */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg-creme); color: var(--text-main); overflow-x: hidden; -webkit-font-smoothing: antialiased; }
        
        /* Premium Header */
        header { 
            background: rgba(27, 48, 34, 0.98); 
            backdrop-filter: blur(15px);
            padding: 12px 5%; 
            position: sticky; top: 0; z-index: 1000;
            border-bottom: 2px solid var(--accent);
        }
        
        .header-main { display: flex; align-items: center; justify-content: space-between; gap: 15px; }
        
        .brand-logo { width: 50px; height: 50px; position: relative; cursor: pointer; transition: var(--transition); }
        .brand-logo img { width: 100%; filter: drop-shadow(0 0 8px rgba(212,175,55,0.4)); }
        .brand-logo:hover { transform: scale(1.1) rotate(5deg); }

        .location-widget { flex: 1; color: var(--white); cursor: pointer; }
        .location-widget p { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.7; }
        .location-widget h4 { font-size: 14px; display: flex; align-items: center; gap: 5px; color: var(--accent); }

        .nav-actions { display: flex; gap: 18px; color: var(--white); font-size: 20px; }
        .nav-actions i { cursor: pointer; transition: 0.3s; }
        .nav-actions i:hover { color: var(--accent); transform: translateY(-2px); }

        /* Modern Search Bar */
        .search-wrapper { margin-top: 15px; position: relative; }
        .search-bar { 
            width: 100%; height: 48px; background: var(--white); 
            border-radius: 15px; display: flex; align-items: center; 
            padding: 0 20px; gap: 10px; border: 1.5px solid transparent;
            transition: var(--transition); box-shadow: var(--shadow-sm);
        }
        .search-bar:focus-within { border-color: var(--accent); box-shadow: 0 0 20px rgba(212,175,55,0.2); }
        .search-bar input { border: none; outline: none; width: 100%; font-size: 14px; font-weight: 500; }

        /* Auto-Scroll Banner */
        .hero-slider { 
            margin: 20px auto; width: 92%; height: 200px; 
            border-radius: 25px; overflow: hidden; position: relative;
            box-shadow: var(--shadow-md);
        }
        .slides-container { display: flex; width: 300%; height: 100%; transition: transform 0.8s ease-in-out; }
        .slide { width: 100%; height: 100%; position: relative; }
        .slide img { width: 100%; height: 100%; object-fit: cover; }
        .slide-overlay { 
            position: absolute; bottom: 0; left: 0; width: 100%; 
            padding: 20px; background: linear-gradient(transparent, rgba(0,0,0,0.7)); 
            color: white; 
        }

        /* Section Heads */
        .section-box { padding: 30px 5%; max-width: 1300px; margin: 0 auto; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .section-header h2 { font-size: 22px; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        .section-header h2 span { width: 35px; height: 35px; background: var(--accent-light); display: flex; align-items: center; justify-content: center; border-radius: 10px; color: var(--accent); }

        /* Premium Product Card */
        .product-grid { 
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; 
        }
        @media(min-width: 768px) { .product-grid { grid-template-columns: repeat(4, 1fr); } }

        .product-card { 
            background: var(--white); border-radius: 20px; padding: 15px;
            position: relative; transition: var(--transition);
            border: 1px solid rgba(0,0,0,0.03); display: flex; flex-direction: column;
            box-shadow: var(--shadow-sm); overflow: hidden;
        }
        .product-card:hover { transform: translateY(-10px); box-shadow: var(--shadow-lg); border-color: var(--accent); }
        
        .img-container { 
            width: 100%; aspect-ratio: 1/1; background: #F8F9FA; border-radius: 15px;
            display: flex; align-items: center; justify-content: center; margin-bottom: 12px;
            overflow: hidden;
        }
        .img-container img { width: 85%; object-fit: contain; transition: 0.6s; }
        .product-card:hover .img-container img { transform: scale(1.15); }

        .badge-premium { position: absolute; top: 10px; left: 10px; background: var(--accent); color: white; padding: 4px 10px; border-radius: 8px; font-size: 10px; font-weight: 700; z-index: 2; }
        
        .product-info h3 { font-size: 14px; font-weight: 700; color: var(--primary); margin-bottom: 5px; height: 40px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .product-info .category { font-size: 10px; color: var(--accent); text-transform: uppercase; font-weight: 800; margin-bottom: 8px; }

        .price-engine { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
        .price-tag { font-size: 18px; font-weight: 800; color: var(--success); }
        .old-price { font-size: 12px; color: var(--text-light); text-decoration: line-through; margin-left: 5px; }

        .add-cart-btn { 
            width: 40px; height: 40px; border-radius: 12px; background: var(--primary); 
            color: var(--white); border: none; cursor: pointer; transition: 0.3s;
        }
        .add-cart-btn:hover { background: var(--accent); transform: rotate(90deg); }

        /* Floating Navigation */
        .bottom-nav { 
            position: fixed; bottom: 20px; left: 5%; width: 90%; 
            background: var(--primary); height: 70px; border-radius: 25px;
            display: flex; justify-content: space-around; align-items: center;
            box-shadow: 0 15px 35px rgba(27,48,34,0.4); z-index: 2000;
        }
        .nav-item { color: rgba(255,255,255,0.6); text-decoration: none; text-align: center; font-size: 10px; transition: 0.3s; }
        .nav-item i { font-size: 22px; display: block; margin-bottom: 4px; }
        .nav-item.active { color: var(--accent); }

        .cart-trigger { 
            width: 70px; height: 70px; background: var(--accent); 
            border-radius: 50%; margin-top: -50px; border: 6px solid var(--bg-creme);
            display: flex; align-items: center; justify-content: center; color: white;
            box-shadow: 0 10px 20px rgba(212,175,55,0.4);
        }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .reveal { animation: fadeIn 0.8s ease-out forwards; }

        .loader-shimmer { background: #eee; background: linear-gradient(110deg, #ececec 8%, #f5f5f5 18%, #ececec 33%); border-radius: 20px; background-size: 200% 100%; animation: 1.5s shine linear infinite; }
        @keyframes shine { to { background-position-x: -200%; } }
    </style>
</head>
<body>

    <header>
        <div class="header-main">
            <div class="brand-logo">
                <img src="https://raw.githubusercontent.com/nemimart/The-Nemi-Mart/main/logo.png" alt="Nemi Mart">
            </div>
            <div class="location-widget" id="geo-location">
                <p>Delivering to</p>
                <h4 id="user-city"><i class="fas fa-location-dot"></i> Detecting location...</h4>
            </div>
            <div class="nav-actions">
                <i class="far fa-heart" onclick="location.href='wishlist.html'"></i>
                <i class="far fa-user-circle" onclick="location.href='profile.html'"></i>
            </div>
        </div>
        <div class="search-wrapper">
            <div class="search-bar">
                <i class="fas fa-search" style="color: var(--accent)"></i>
                <input type="text" placeholder="Search Ayurveda, Immunity, Skincare..." id="mainSearch">
            </div>
        </div>
    </header>

    <div class="hero-slider">
        <div class="slides-container" id="mainSlider">
            <div class="slide">
                <img src="https://images.unsplash.com/photo-1611073221707-e3e1339b7518?auto=format&fit=crop&w=1200&q=80" alt="Banner 1">
                <div class="slide-overlay"><h3>Purest Shilajit from Himalayas</h3></div>
            </div>
            <div class="slide">
                <img src="https://images.unsplash.com/photo-1608571423902-eed4a5ad8108?auto=format&fit=crop&w=1200&q=80" alt="Banner 2">
                <div class="slide-overlay"><h3>Winter Immunity Booster Deals</h3></div>
            </div>
            <div class="slide">
                <img src="https://images.unsplash.com/photo-1540555700478-4be289fbecef?auto=format&fit=crop&w=1200&q=80" alt="Banner 3">
                <div class="slide-overlay"><h3>Glow Naturally with Kumkumadi</h3></div>
            </div>
        </div>
    </div>

    <section class="section-box reveal">
        <div class="section-header">
            <h2><span><i class="fas fa-bolt"></i></span> Top Selling</h2>
            <a href="allproduct.html" style="color: var(--accent); font-weight: 700; text-decoration: none;">View All</a>
        </div>
        <div class="product-grid" id="topSellingGrid">
            <div class="loader-shimmer" style="height: 250px;"></div>
            <div class="loader-shimmer" style="height: 250px;"></div>
        </div>
    </section>

    <section class="section-box reveal" style="background: #fdfaf0; border-radius: 40px 40px 0 0;">
        <div class="section-header">
            <h2><span><i class="fas fa-crown"></i></span> Premium Range</h2>
            <a href="allproduct.html" style="color: var(--accent); font-weight: 700; text-decoration: none;">View All</a>
        </div>
        <div class="product-grid" id="premiumGrid">
            <div class="loader-shimmer" style="height: 250px;"></div>
            <div class="loader-shimmer" style="height: 250px;"></div>
        </div>
    </section>

    <section class="section-box reveal">
        <div class="section-header">
            <h2><span><i class="fas fa-shop"></i></span> Our Collection</h2>
        </div>
        <div class="product-grid" id="allProductsGrid"></div>
    </section>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active"><i class="fas fa-home"></i>Home</a>
        <a href="allproduct.html" class="nav-item"><i class="fas fa-leaf"></i>Shop</a>
        <div class="cart-trigger" onclick="location.href='cart.html'">
            <i class="fas fa-shopping-bag fa-lg"></i>
            <span id="cartCount" style="position: absolute; top: 10px; right: 10px; background: red; color: white; border-radius: 50%; padding: 2px 6px; font-size: 10px; font-weight: 900;">0</span>
        </div>
        <a href="orders.html" class="nav-item"><i class="fas fa-truck-fast"></i>Orders</a>
        <a href="profile.html" class="nav-item"><i class="fas fa-user-circle"></i>Profile</a>
    </nav>

    <script>
        // 1. Database & Cloudinary Config
        const firebaseConfig = { databaseURL: "https://nemi-mart-2-default-rtdb.firebaseio.com/" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 2. Geolocation Engine
        async function fetchLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async (pos) => {
                    try {
                        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${pos.coords.latitude}&lon=${pos.coords.longitude}&format=json`);
                        const data = await res.json();
                        const city = data.address.city || data.address.town || data.address.village || "Patiala";
                        document.getElementById('user-city').innerHTML = `<i class="fas fa-location-dot"></i> ${city}, ${data.address.state}`;
                    } catch (e) {
                        document.getElementById('user-city').innerText = "Akash, Patiala";
                    }
                }, () => {
                    document.getElementById('user-city').innerText = "Akash, Patiala";
                });
            }
        }

        // 3. Auto-Slider Engine
        let currentSlide = 0;
        function startSlider() {
            const slider = document.getElementById('mainSlider');
            setInterval(() => {
                currentSlide = (currentSlide + 1) % 3;
                slider.style.transform = `translateX(-${currentSlide * 33.33}%)`;
            }, 4000);
        }

        // 4. Product Card Template
        function createCard(p) {
            const img = p.image || p.img || 'https://res.cloudinary.com/despxo7zb/image/upload/v1/nemi-placeholder';
            const oldPriceMarkup = p.oldPrice ? `<span class="old-price">₹${p.oldPrice}</span>` : '';
            
            return `
                <div class="product-card" onclick="location.href='product-detail.html?id=${p.id}'">
                    ${p.isPremium ? '<span class="badge-premium">PREMIUM</span>' : ''}
                    <div class="img-container">
                        <img src="${img}" alt="${p.name}" loading="lazy">
                    </div>
                    <div class="product-info">
                        <p class="category">${p.category || 'Ayurveda'}</p>
                        <h3>${p.name}</h3>
                        <div class="price-engine">
                            <div class="price-tag">₹${p.price} ${oldPriceMarkup}</div>
                            <button class="add-cart-btn" onclick="addToCart(event, '${p.id}')">
                                <i class="fas fa-plus"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // 5. Data Fetching (Admin Driven)
        function loadProducts() {
            db.ref('products').on('value', (snap) => {
                const data = snap.val();
                if (!data) return;

                const topGrid = document.getElementById('topSellingGrid');
                const premiumGrid = document.getElementById('premiumGrid');
                const allGrid = document.getElementById('allProductsGrid');

                topGrid.innerHTML = ''; premiumGrid.innerHTML = ''; allGrid.innerHTML = '';

                Object.keys(data).forEach(key => {
                    const p = { id: key, ...data[key] };
                    const card = createCard(p);

                    // Admin flags check
                    if (p.isTopSelling === true || p.isTopSelling === "true") topGrid.innerHTML += card;
                    if (p.isPremium === true || p.isPremium === "true") premiumGrid.innerHTML += card;
                    
                    allGrid.innerHTML += card;
                });
                
                updateCartBadge();
            });
        }

        // 6. Utility Functions
        function addToCart(e, id) {
            e.stopPropagation();
            let cart = JSON.parse(localStorage.getItem('nemi_cart')) || [];
            if(!cart.includes(id)) {
                cart.push(id);
                localStorage.setItem('nemi_cart', JSON.stringify(cart));
                alert("Product added to Mart! 🌿");
                updateCartBadge();
            }
        }

        function updateCartBadge() {
            const cart = JSON.parse(localStorage.getItem('nemi_cart')) || [];
            document.getElementById('cartCount').innerText = cart.length;
        }

        // Initialize
        window.onload = () => {
            fetchLocation();
            startSlider();
            loadProducts();
        };
    </script>
</body>
</html>
