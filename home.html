 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Nemi Mart | Premium Ayurveda Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ==========================================================================
           1. PREMIUM ROOT & ANIMATIONS
           ========================================================================== */
        :root {
            --creme: #FFFDF5;
            --gold: #D4AF37;
            --gold-dark: #B8860B;
            --dark-green: #1B3022;
            --leaf-green: #2D5A27;
            --leaf-light: #eaf2e9;
            --white: #ffffff;
            --text-dark: #333333;
            --text-muted: #888888;
            --soft-shadow: 0 10px 40px rgba(0,0,0,0.06);
            --premium-shadow: 0 20px 40px rgba(27,48,34,0.15);
            --transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--creme); color: var(--text-dark); padding-bottom: 110px; overflow-x: hidden; }

        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulseGold { 0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(212, 175, 55, 0); } 100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); } }

        /* ==========================================================================
           2. HEADER (GLASSMORPHISM)
           ========================================================================== */
        header { 
            background: rgba(27, 48, 34, 0.98); 
            backdrop-filter: blur(20px);
            padding: 15px 5%; 
            position: sticky; top: 0; z-index: 1000; 
            border-bottom: 2px solid var(--gold);
        }
        .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        
        .logo-area { position: relative; width: 55px; height: 55px; display: flex; justify-content: center; align-items: center; text-decoration: none; }
        .main-logo { width: 42px; z-index: 5; filter: drop-shadow(0 0 8px var(--gold)); animation: float 3s ease-in-out infinite; }

        .address-box { flex: 1; margin-left: 15px; color: white; cursor: pointer; }
        .address-box p { font-size: 10px; opacity: 0.7; text-transform: uppercase; letter-spacing: 1px; }
        .address-box h4 { font-size: 13px; font-weight: 600; color: var(--gold); display: flex; align-items: center; gap: 5px; }

        .top-actions { display: flex; gap: 18px; font-size: 20px; }
        .top-actions a { color: white; transition: var(--transition); }
        .top-actions a:hover { color: var(--gold); transform: scale(1.2); }

        .search-container { position: relative; width: 100%; margin-top: 10px; }
        .search-fake-input { 
            background: white; border-radius: 15px; height: 48px; display: flex; align-items: center; 
            padding: 0 20px; color: var(--text-muted); font-size: 14px; box-shadow: inset 0 2px 10px rgba(0,0,0,0.05);
            border: 1px solid transparent; transition: var(--transition);
        }
        .search-fake-input:active { border-color: var(--gold); transform: scale(0.98); }

        /* ==========================================================================
           3. DYNAMIC SLIDING BANNERS (4 SLIDES)
           ========================================================================== */
        .banner-wrapper { margin: 20px 5%; border-radius: 25px; overflow: hidden; position: relative; box-shadow: var(--premium-shadow); height: 180px; }
        .banner-container { display: flex; width: 400%; height: 100%; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .banner-slide { width: 25%; height: 100%; }
        .banner-slide img { width: 100%; height: 100%; object-fit: cover; }

        .banner-dots { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
        .dot { width: 8px; height: 8px; background: rgba(255,255,255,0.5); border-radius: 50%; transition: 0.3s; }
        .dot.active { background: var(--gold); width: 25px; border-radius: 10px; }

        /* ==========================================================================
           4. CATEGORIES
           ========================================================================== */
        .cat-strip { display: flex; overflow-x: auto; padding: 25px 5%; gap: 20px; scrollbar-width: none; }
        .cat-strip::-webkit-scrollbar { display: none; }
        .cat-card { text-align: center; min-width: 80px; transition: var(--transition); }
        .icon-circle { 
            width: 70px; height: 70px; background: white; border-radius: 24px; 
            display: flex; justify-content: center; align-items: center; margin: 0 auto 10px; 
            font-size: 24px; color: var(--leaf-green); box-shadow: var(--soft-shadow);
            border: 1px solid rgba(0,0,0,0.03); transition: var(--transition);
        }
        .cat-card:hover .icon-circle { background: var(--dark-green); color: var(--gold); transform: translateY(-8px) rotate(10deg); }
        .cat-card span { font-size: 11px; font-weight: 700; color: var(--dark-green); }

        /* ==========================================================================
           5. PRODUCT GRID & CARDS
           ========================================================================== */
        .section-header { display: flex; justify-content: space-between; align-items: center; padding: 20px 5% 15px; }
        .section-header h2 { font-size: 18px; color: var(--dark-green); font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 0 5%; }
        .p-card { 
            background: white; border-radius: 25px; padding: 15px; position: relative;
            transition: var(--transition); border: 1px solid rgba(0,0,0,0.03);
            animation: fadeIn 0.8s ease-out; display: flex; flex-direction: column;
        }
        .p-card:hover { transform: translateY(-10px); box-shadow: var(--premium-shadow); border-color: var(--gold); }
        
        .p-img-box { width: 100%; aspect-ratio: 1; background: #FBFBFB; border-radius: 20px; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .p-img-box img { width: 85%; object-fit: contain; transition: 0.5s; }
        .p-card:hover .p-img-box img { transform: scale(1.15); }
        
        .discount-badge { position: absolute; top: 12px; left: 12px; background: #ff4757; color: white; font-size: 10px; font-weight: 800; padding: 4px 10px; border-radius: 8px; z-index: 2; }
        
        .p-tag { font-size: 9px; font-weight: 700; color: var(--gold); text-transform: uppercase; margin-bottom: 5px; letter-spacing: 1px; }
        .p-title { font-size: 13px; font-weight: 700; color: var(--dark-green); height: 40px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        
        .p-price-row { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
        .p-price { color: var(--leaf-green); font-weight: 800; font-size: 18px; }
        .p-old-price { font-size: 11px; color: var(--text-muted); text-decoration: line-through; display: block; font-weight: 400; }
        
        .add-btn { 
            background: var(--dark-green); color: white; border: none; width: 40px; height: 40px; border-radius: 12px; 
            display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; transition: 0.3s;
        }
        .add-btn:active { transform: scale(0.8); }
        .add-btn.added { background: var(--leaf-green); animation: pulseGold 1.5s infinite; }

        /* ==========================================================================
           6. PREMIUM BOTTOM NAV (MODERN)
           ========================================================================== */
        .bottom-nav { 
            position: fixed; bottom: 0; width: 100%; background: white; height: 85px;
            display: flex; justify-content: space-around; align-items: center;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.1); border-radius: 35px 35px 0 0; z-index: 2000;
        }
        .nav-item { text-decoration: none; color: #bbb; display: flex; flex-direction: column; align-items: center; transition: 0.3s; position: relative; }
        .nav-item i { font-size: 22px; margin-bottom: 4px; transition: 0.3s; }
        .nav-item span { font-size: 10px; font-weight: 600; }
        
        .nav-item.active { color: var(--leaf-green); }
        .nav-item.active i { color: var(--gold); transform: translateY(-5px); }
        .nav-item.active::after { content: ''; position: absolute; bottom: -8px; width: 5px; height: 5px; background: var(--gold); border-radius: 50%; }

        .cart-float { position: relative; top: -35px; }
        .cart-circle { 
            width: 70px; height: 70px; background: var(--dark-green); border: 8px solid var(--creme); 
            border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; 
            box-shadow: 0 10px 20px rgba(27,48,34,0.3); transition: 0.5s;
        }
        .cart-circle:hover { transform: rotate(15deg) scale(1.1); background: var(--leaf-green); }
        .badge { position: absolute; top: -5px; right: -5px; background: #ff4757; color: white; font-size: 11px; width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--creme); display: flex; align-items: center; justify-content: center; font-weight: 800; }

        /* Toast & Helpers */
        #toast-container { position: fixed; top: 30px; left: 50%; transform: translateX(-50%); z-index: 10000; width: 90%; }
        .toast { background: var(--dark-green); color: white; padding: 15px 25px; border-radius: 15px; margin-bottom: 10px; border-left: 5px solid var(--gold); box-shadow: 0 10px 30px rgba(0,0,0,0.2); animation: fadeIn 0.4s ease-out; }
        .empty-state { grid-column: span 2; text-align: center; padding: 50px 20px; }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <header>
        <div class="header-top">
            <a href="index.html" class="logo-area">
                <img src="https://raw.githubusercontent.com/nemimart/The-Nemi-Mart/main/logo.png" class="main-logo" alt="Logo">
            </a>
            <div class="address-box" onclick="window.location.href='address.html'">
                <p>Deliver to</p>
                <h4 id="displayLocation">Detecting... <i class="fas fa-chevron-down"></i></h4>
            </div>
            <div class="top-actions">
                <a href="heart.html"><i class="far fa-heart"></i></a>
                <a href="profile.html"><i class="far fa-user-circle"></i></a>
            </div>
        </div>
        <div class="search-container" onclick="window.location.href='search.html'">
            <div class="search-fake-input">
                <i class="fas fa-search" style="margin-right: 15px; color: var(--gold);"></i>
                Search Ayurvedic Medicine...
            </div>
        </div>
    </header>

    <div class="banner-wrapper">
        <div class="banner-container" id="bannerContainer">
            <div class="banner-slide"><img src="https://raw.githubusercontent.com/nemimart/The-Nemi-Mart/main/Amritprash%20(1).png" alt="B1"></div>
            <div class="banner-slide"><img src="https://raw.githubusercontent.com/nemimart/The-Nemi-Mart/main/Amritprash%20(1).png" alt="B2"></div>
            <div class="banner-slide"><img src="https://raw.githubusercontent.com/nemimart/The-Nemi-Mart/main/Amritprash%20(1).png" alt="B3"></div>
            <div class="banner-slide"><img src="https://raw.githubusercontent.com/nemimart/The-Nemi-Mart/main/Amritprash%20(1).png" alt="B4"></div>
        </div>
        <div class="banner-dots" id="bannerDots"></div>
    </div>

    <div class="cat-strip" id="categoryContainer"></div>

    <div class="section-header">
        <h2>🔥 Top Selling</h2>
        <a href="allproduct.html" style="color: var(--leaf-green); font-size: 13px; font-weight: 700; text-decoration: none;">View All</a>
    </div>
    <div class="product-grid" id="topSellingGrid"></div>

    <div class="section-header">
        <h2>👑 Premium Choice</h2>
    </div>
    <div class="product-grid" id="premiumGrid"></div>

    <div class="section-header">
        <h2>📦 Just For You</h2>
    </div>
    <div class="product-grid" id="allProductsGrid"></div>

    <footer style="background: var(--dark-green); padding: 50px 5% 130px; color: white; text-align: center; margin-top: 50px; border-radius: 40px 40px 0 0;">
        <img src="https://raw.githubusercontent.com/nemimart/The-Nemi-Mart/main/logo.png" style="width: 70px; margin-bottom: 20px; filter: brightness(0) invert(1);">
        <h3 style="color: var(--gold); letter-spacing: 2px;">THE NEMI MART</h3>
        <p style="font-size: 12px; opacity: 0.6; margin-top: 10px;">Swasthya aur Parampara ka Sangam.</p>
        <div style="margin-top: 30px; font-size: 11px; opacity: 0.4;">© 2026 Arham Insights | Patiala, Punjab</div>
    </footer>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="allproduct.html" class="nav-item"><i class="fas fa-th-large"></i><span>Shop</span></a>
        <div class="cart-float">
            <a href="cart.html">
                <div class="cart-circle">
                    <i class="fas fa-shopping-bag" style="font-size: 26px;"></i>
                    <div class="badge" id="cartBadge">0</div>
                </div>
            </a>
        </div>
        <a href="notifications.html" class="nav-item"><i class="fas fa-bell"></i><span>Alerts</span></a>
        <a href="profile.html" class="nav-item"><i class="fas fa-user"></i><span>Profile</span></a>
    </nav>

    <script>
        const HomeEngine = {
            currentIndex: 0,
            
            init() {
                this.syncAddress();
                this.renderCategories();
                this.renderDynamicProducts();
                this.initBanners();
                this.updateCartBadge();
                
                // Interval for Auto-slide
                setInterval(() => this.slideBanners(), 4000);
            },

            syncAddress() {
                const display = document.getElementById('displayLocation');
                const saved = JSON.parse(localStorage.getItem('nemi_user_address'));
                display.innerHTML = saved ? `${saved.name}, ${saved.city}` : "Akash, Patiala <i class='fas fa-chevron-down'></i>";
            },

            initBanners() {
                const dots = document.getElementById('bannerDots');
                for(let i=0; i<4; i++) {
                    const dot = document.createElement('div');
                    dot.className = `dot ${i===0 ? 'active' : ''}`;
                    dots.appendChild(dot);
                }
            },

            slideBanners() {
                const container = document.getElementById('bannerContainer');
                const dots = document.querySelectorAll('.dot');
                this.currentIndex = (this.currentIndex + 1) % 4;
                container.style.transform = `translateX(-${this.currentIndex * 25}%)`;
                dots.forEach((d, i) => d.classList.toggle('active', i === this.currentIndex));
            },

            renderCategories() {
                const cats = [
                    { name: "Immunity", icon: "fa-shield-virus" },
                    { name: "Diabetes", icon: "fa-hand-holding-droplet" },
                    { name: "Hair Care", icon: "fa-sparkles" },
                    { name: "Digestive", icon: "fa-leaf" },
                    { name: "Vitality", icon: "fa-bolt" }
                ];
                document.getElementById('categoryContainer').innerHTML = cats.map(c => `
                    <div class="cat-card" onclick="window.location.href='allproduct.html?cat=${c.name}'">
                        <div class="icon-circle"><i class="fas ${c.icon}"></i></div>
                        <span>${c.name}</span>
                    </div>
                `).join('');
            },

            renderDynamicProducts() {
                // FETCH FROM ALLPRODUCT.HTML DATA SOURCE
                const allProducts = JSON.parse(localStorage.getItem('nemi_master_products')) || [];
                const topGrid = document.getElementById('topSellingGrid');
                const premGrid = document.getElementById('premiumGrid');
                const allGrid = document.getElementById('allProductsGrid');

                if (allProducts.length === 0) {
                    const emptyHtml = `
                        <div class="empty-state">
                            <i class="fas fa-box-open" style="font-size: 40px; color: #ddd; margin-bottom: 10px;"></i>
                            <p style="color: #999;">Abhi koi products nahi hain.<br>Add some in Shop page!</p>
                        </div>`;
                    allGrid.innerHTML = emptyHtml;
                    topGrid.innerHTML = emptyHtml;
                    premGrid.innerHTML = emptyHtml;
                    return;
                }

                let topH = '', premH = '', allH = '';

                allProducts.forEach((p, index) => {
                    const card = this.createCard(p);
                    allH += card;
                    if (p.isHot || index < 4) topH += card; // Logic: Hot marked or first 4
                    if (p.price > 499) premH += card; // Logic: Price based premium
                });

                allGrid.innerHTML = allH;
                topGrid.innerHTML = topH;
                premGrid.innerHTML = premH;
            },

            createCard(p) {
                const cart = JSON.parse(localStorage.getItem('nemi_cart')) || [];
                const inCart = cart.some(item => item.id === p.id);

                return `
                    <div class="p-card" onclick="window.location.href='product.html?id=${p.id}'">
                        ${p.discount ? `<div class="discount-badge">${p.discount}% OFF</div>` : ''}
                        <div class="p-img-box">
                            <img src="${p.img || 'https://raw.githubusercontent.com/nemimart/The-Nemi-Mart/main/logo.png'}" alt="img">
                        </div>
                        <span class="p-tag">${p.category || 'Ayurveda'}</span>
                        <div class="p-title">${p.name}</div>
                        <div class="p-price-row">
                            <div class="p-price">
                                ₹${p.price}
                                <span class="p-old-price">₹${parseInt(p.price) + 150}</span>
                            </div>
                            <button class="add-btn ${inCart ? 'added' : ''}" onclick="HomeEngine.addToCart(event, '${p.id}')">
                                <i class="fas ${inCart ? 'fa-check' : 'fa-plus'}"></i>
                            </button>
                        </div>
                    </div>
                `;
            },

            addToCart(e, id) {
                e.stopPropagation();
                const allProducts = JSON.parse(localStorage.getItem('nemi_master_products')) || [];
                const product = allProducts.find(p => p.id == id);
                let cart = JSON.parse(localStorage.getItem('nemi_cart')) || [];

                if (!cart.some(i => i.id == id)) {
                    cart.push({...product, qty: 1});
                    localStorage.setItem('nemi_cart', JSON.stringify(cart));
                    this.showToast("Added to Basket!");
                    this.updateCartBadge();
                    const btn = e.target.closest('button');
                    btn.classList.add('added');
                    btn.innerHTML = '<i class="fas fa-check"></i>';
                } else {
                    window.location.href = 'cart.html';
                }
            },

            updateCartBadge() {
                const cart = JSON.parse(localStorage.getItem('nemi_cart')) || [];
                document.getElementById('cartBadge').innerText = cart.length;
            },

            showToast(msg) {
                const container = document.getElementById('toast-container');
                const t = document.createElement('div');
                t.className = 'toast';
                t.innerHTML = `<i class="fas fa-check-circle" style="color:var(--gold)"></i> ${msg}`;
                container.appendChild(t);
                setTimeout(() => t.remove(), 3000);
            }
        };

        document.addEventListener('DOMContentLoaded', () => HomeEngine.init());
    </script>
</body>
</html>
