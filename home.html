 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Nemi Mart | Premium Ayurveda</title>
    
    <meta name="description" content="Premium Ayurvedic Products by The Nemi Mart. Quality you can trust.">
    <meta name="theme-color" content="#1B3022">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <style>
        /* ==========================================================================
           1. CSS VARIABLES & THEME SETUP
           ========================================================================== */
        :root {
            --creme: #FFFDF5;
            --gold: #D4AF37;
            --gold-dark: #B8860B;
            --gold-light: #F3E5AB;
            --dark-green: #1B3022;
            --leaf-green: #2D5A27;
            --leaf-light: #eaf2e9;
            --white: #ffffff;
            --text-dark: #333333;
            --text-muted: #888888;
            --error: #ff4757;
            --soft-shadow: 0 10px 40px rgba(0,0,0,0.06);
            --card-shadow: 0 15px 35px rgba(27,48,34,0.08);
            --hover-shadow: 0 20px 50px rgba(212,175,55,0.2);
            --transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--creme); 
            color: var(--text-dark); 
            padding-bottom: 100px; 
            overflow-x: hidden; 
            line-height: 1.6;
        }

        /* Smooth Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--creme); }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }

        /* ==========================================================================
           2. HEADER & SEARCH BAR
           ========================================================================== */
        header { 
            background: rgba(27, 48, 34, 0.96); 
            backdrop-filter: blur(15px);
            padding: 15px 5%; 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            border-bottom: 2px solid var(--gold);
        }

        .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        
        .logo-area { position: relative; width: 60px; height: 60px; display: flex; justify-content: center; align-items: center; text-decoration: none; }
        .main-logo { width: 45px; z-index: 5; filter: drop-shadow(0 0 8px var(--gold)); transition: var(--transition); }
        .logo-area:hover .main-logo { transform: scale(1.1) rotate(-5deg); }

        .orbit-icons { position: absolute; width: 100%; height: 100%; animation: rotateFull 15s linear infinite; }
        .orbit-icons i { position: absolute; font-size: 10px; color: var(--gold); opacity: 0.6; }
        .oi1 { top: 0; left: 50%; } .oi2 { bottom: 0; left: 50%; } .oi3 { left: 0; top: 50%; } .oi4 { right: 0; top: 50%; }
        @keyframes rotateFull { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .address-box { flex: 1; margin-left: 15px; color: white; cursor: pointer; }
        .address-box p { font-size: 10px; opacity: 0.7; text-transform: uppercase; letter-spacing: 1px; }
        .address-box h4 { font-size: 14px; color: var(--gold); display: flex; align-items: center; gap: 5px; }

        .top-actions { display: flex; gap: 15px; }
        .top-actions a { color: white; font-size: 22px; transition: 0.3s; }
        .top-actions a:hover { color: var(--gold); transform: translateY(-2px); }

        .search-container { 
            background: white; 
            border-radius: 15px; 
            height: 45px; 
            display: flex; 
            align-items: center; 
            padding: 0 15px; 
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
            cursor: text;
        }
        .search-container input { 
            border: none; 
            outline: none; 
            width: 100%; 
            padding-left: 10px; 
            font-size: 14px;
            background: transparent;
        }

        /* ==========================================================================
           3. DYNAMIC ELEMENTS (CAT STRIP, BANNERS)
           ========================================================================== */
        .cat-strip { 
            display: flex; 
            overflow-x: auto; 
            padding: 25px 5%; 
            gap: 20px; 
            scrollbar-width: none;
            background: white;
        }
        .cat-strip::-webkit-scrollbar { display: none; }
        
        .cat-card { min-width: 80px; text-align: center; cursor: pointer; text-decoration: none; }
        .icon-circle { 
            width: 65px; height: 65px; 
            background: var(--leaf-light); 
            border-radius: 20px; 
            display: flex; justify-content: center; align-items: center;
            margin-bottom: 8px; transition: var(--transition);
            box-shadow: var(--soft-shadow);
        }
        .cat-card i { font-size: 24px; color: var(--leaf-green); }
        .cat-card span { font-size: 12px; font-weight: 600; color: var(--dark-green); }
        .cat-card:hover .icon-circle { background: var(--dark-green); transform: translateY(-5px); }
        .cat-card:hover i { color: var(--gold); }

        .banner-wrapper { margin: 20px 5%; border-radius: 25px; overflow: hidden; box-shadow: var(--card-shadow); }
        .banner-container { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
        .banner-slide { min-width: 100%; scroll-snap-align: start; }
        .banner-slide img { width: 100%; height: 180px; object-fit: cover; }

        /* ==========================================================================
           4. PRODUCT GRID & CARDS
           ========================================================================== */
        .section-header { display: flex; justify-content: space-between; align-items: center; padding: 30px 5% 15px; }
        .section-header h2 { font-size: 20px; color: var(--dark-green); font-weight: 700; }
        .section-header h2 i { color: var(--gold); margin-right: 8px; }

        .product-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 15px; 
            padding: 0 5%; 
        }

        .p-card { 
            background: white; 
            border-radius: 20px; 
            padding: 15px; 
            position: relative;
            box-shadow: var(--soft-shadow);
            transition: var(--transition);
            border: 1px solid rgba(0,0,0,0.02);
        }
        .p-card:hover { transform: translateY(-8px); box-shadow: var(--hover-shadow); }

        .discount-badge {
            position: absolute; top: 10px; left: 10px;
            background: var(--error); color: white;
            font-size: 10px; font-weight: 700;
            padding: 3px 8px; border-radius: 5px; z-index: 2;
        }

        .p-img-box { 
            width: 100%; aspect-ratio: 1/1; 
            background: #f9f9f9; border-radius: 15px;
            display: flex; justify-content: center; align-items: center;
            margin-bottom: 12px; overflow: hidden;
        }
        .p-img-box img { max-width: 80%; transition: 0.5s; }
        .p-card:hover .p-img-box img { transform: scale(1.1); }

        .p-title { font-size: 13px; font-weight: 600; height: 40px; overflow: hidden; margin-bottom: 10px; }
        .p-price-row { display: flex; justify-content: space-between; align-items: center; }
        .p-price { font-weight: 700; color: var(--leaf-green); font-size: 16px; }
        .p-old-price { font-size: 11px; color: var(--text-muted); text-decoration: line-through; margin-left: 5px; }

        .add-btn {
            background: var(--dark-green); color: white;
            border: none; width: 35px; height: 35px;
            border-radius: 10px; cursor: pointer; transition: 0.3s;
        }
        .add-btn.added { background: var(--gold); }

        /* ==========================================================================
           5. NOTIFICATIONS & NAVIGATION
           ========================================================================== */
        #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; width: 90%; }
        .nemi-toast {
            background: var(--dark-green); color: white;
            padding: 15px; border-radius: 12px; margin-bottom: 10px;
            display: flex; align-items: center; gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: slideDown 0.4s ease-out;
        }
        @keyframes slideDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .bottom-nav {
            position: fixed; bottom: 0; width: 100%;
            background: white; display: flex; justify-content: space-around;
            padding: 10px 0 25px; box-shadow: 0 -5px 20px rgba(0,0,0,0.05);
            border-radius: 25px 25px 0 0; z-index: 1000;
        }
        .nav-item { text-align: center; color: #bbb; text-decoration: none; font-size: 10px; }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }
        .nav-item.active { color: var(--leaf-green); }

        .cart-float { margin-top: -45px; }
        .cart-circle {
            width: 65px; height: 65px;
            background: var(--leaf-green); border: 5px solid var(--creme);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            color: white; font-size: 24px; position: relative;
        }
        .cart-badge {
            position: absolute; top: 0; right: 0;
            background: var(--error); width: 20px; height: 20px;
            border-radius: 50%; font-size: 10px; display: flex;
            justify-content: center; align-items: center; border: 2px solid white;
        }

        .loader { 
            grid-column: 1/-1; text-align: center; padding: 50px; 
            color: var(--leaf-green); font-weight: 600;
        }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <header>
        <div class="header-top">
            <a href="#" class="logo-area">
                <div class="orbit-icons">
                    <i class="fas fa-leaf oi1"></i>
                    <i class="fas fa-star oi2"></i>
                    <i class="fas fa-plus oi3"></i>
                </div>
                <img src="https://raw.githubusercontent.com/nemimart/The-Nemi-Mart/main/logo.png" class="main-logo" alt="Nemi Mart">
            </a>
            <div class="address-box" onclick="location.href='address.html'">
                <p>Deliver to</p>
                <h4>Akash, Patiala... <i class="fas fa-chevron-down"></i></h4>
            </div>
            <div class="top-actions">
                <a href="wishlist.html"><i class="far fa-heart"></i></a>
                <a href="profile.html"><i class="far fa-user-circle"></i></a>
            </div>
        </div>
        <div class="search-container">
            <i class="fas fa-search" style="color: var(--gold);"></i>
            <input type="text" id="mainSearch" placeholder="Search Ayurveda, Herbs, Health...">
        </div>
    </header>

    <div class="cat-strip" id="catStrip">
        </div>

    <div class="banner-wrapper">
        <div class="banner-container">
            <div class="banner-slide"><img src="https://res.cloudinary.com/demo/image/upload/v1652345678/docs/banner1.jpg" alt="Banner 1"></div>
            <div class="banner-slide"><img src="https://res.cloudinary.com/demo/image/upload/v1652345678/docs/banner2.jpg" alt="Banner 2"></div>
        </div>
    </div>

    <div class="section-header">
        <h2><i class="fas fa-bolt"></i> Trending Now</h2>
        <a href="all-products.html" style="color: var(--gold); font-size: 12px; font-weight: 700; text-decoration: none;">VIEW ALL</a>
    </div>
    <div class="product-grid" id="trendingGrid">
        <div class="loader">Loading Essentials...</div>
    </div>

    <div class="section-header">
        <h2><i class="fas fa-crown"></i> Nemi Originals</h2>
    </div>
    <div class="product-grid" id="premiumGrid">
        <div class="loader">Loading Premium...</div>
    </div>

    <footer style="padding: 40px 5%; background: var(--dark-green); color: white; margin-top: 50px; text-align: center; border-radius: 30px 30px 0 0;">
        <img src="https://raw.githubusercontent.com/nemimart/The-Nemi-Mart/main/logo.png" width="60" style="filter: brightness(0) invert(1); margin-bottom: 15px;">
        <p style="font-size: 12px; opacity: 0.6;">&copy; 2026 Arham Insights. All Rights Reserved.</p>
    </footer>

    <nav class="bottom-nav">
        <a href="#" class="nav-item active"><i class="fas fa-home"></i>Home</a>
        <a href="shop.html" class="nav-item"><i class="fas fa-th-large"></i>Shop</a>
        <div class="cart-float" onclick="location.href='cart.html'">
            <div class="cart-circle">
                <i class="fas fa-shopping-basket"></i>
                <div class="cart-badge" id="cartCount">0</div>
            </div>
        </div>
        <a href="notifications.html" class="nav-item"><i class="fas fa-bell"></i>Alerts</a>
        <a href="orders.html" class="nav-item"><i class="fas fa-box"></i>Orders</a>
    </nav>

    <script>
        /* ==========================================================================
           CORE ENGINE - V5.0
           Developer: Akash (Arham Insights)
           ========================================================================== */

        // 1. Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAs-EXAMPLE-KEY",
            authDomain: "nemi-mart.firebaseapp.com",
            projectId: "nemi-mart",
            storageBucket: "nemi-mart.appspot.com",
            appId: "1:123456789:web:abcdef"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 2. Data Management (Local & Cloud)
        const categories = [
            { name: 'Immunity', icon: 'fa-shield-virus' },
            { name: 'Skincare', icon: 'fa-spa' },
            { name: 'Haircare', icon: 'fa-wind' },
            { name: 'Digestion', icon: 'fa-leaf' },
            { name: 'Wellness', icon: 'fa-heartbeat' }
        ];

        const CartManager = {
            key: 'NEMI_USER_CART',
            items: JSON.parse(localStorage.getItem('NEMI_USER_CART')) || [],
            
            add(product) {
                const exists = this.items.find(i => i.id === product.id);
                if (exists) {
                    Toast.show("Update", "Item quantity increased!");
                    exists.qty++;
                } else {
                    this.items.push({...product, qty: 1});
                    Toast.show("Success", "Added to your basket!");
                }
                this.save();
                if (window.navigator.vibrate) window.navigator.vibrate(50);
            },
            
            save() {
                localStorage.setItem(this.key, JSON.stringify(this.items));
                document.getElementById('cartCount').innerText = this.items.length;
            }
        };

        const Toast = {
            show(title, msg) {
                const container = document.getElementById('toast-container');
                const div = document.createElement('div');
                div.className = 'nemi-toast';
                div.innerHTML = `<i class="fas fa-check-circle" style="color:var(--gold)"></i> 
                                 <div><b>${title}</b><br><small>${msg}</small></div>`;
                container.appendChild(div);
                setTimeout(() => {
                    div.style.opacity = '0';
                    setTimeout(() => div.remove(), 500);
                }, 3000);
            }
        };

        // 3. Cloudinary Image Formatter
        function getCloudinaryUrl(publicId) {
            // Cloudinary transformation for optimized mobile delivery
            return `https://res.cloudinary.com/demo/image/upload/c_scale,w_400,q_auto,f_auto/${publicId}`;
        }

        // 4. UI Rendering Engine
        function renderCategories() {
            const container = document.getElementById('catStrip');
            container.innerHTML = categories.map(cat => `
                <div class="cat-card">
                    <div class="icon-circle"><i class="fas ${cat.icon}"></i></div>
                    <span>${cat.name}</span>
                </div>
            `).join('');
        }

        async function loadProducts() {
            try {
                // In production, use: const snapshot = await db.collection('products').get();
                // Simulation data for demo:
                const demoProducts = [
                    { id: '1', name: 'Ashwagandha Gold Capsules', price: 499, oldPrice: 899, img: 'v1652345678/ashwa', isTrending: true },
                    { id: '2', name: 'Pure Himalayan Shilajit', price: 1299, oldPrice: 1599, img: 'v1652345678/shilajit', isPremium: true },
                    { id: '3', name: 'Organic Triphala Churna', price: 250, oldPrice: 400, img: 'v1652345678/triphala', isTrending: true },
                    { id: '4', name: 'Kesar Face Oil', price: 799, oldPrice: 1200, img: 'v1652345678/kesar', isPremium: true }
                ];

                renderGrid('trendingGrid', demoProducts.filter(p => p.isTrending));
                renderGrid('premiumGrid', demoProducts.filter(p => p.isPremium));
                
            } catch (err) {
                console.error("Firebase Error:", err);
            }
        }

        function renderGrid(targetId, products) {
            const grid = document.getElementById(targetId);
            grid.innerHTML = products.map(p => {
                const disc = Math.round(((p.oldPrice - p.price) / p.oldPrice) * 100);
                return `
                    <div class="p-card" onclick="location.href='product.html?id=${p.id}'">
                        <div class="discount-badge">${disc}% OFF</div>
                        <div class="p-img-box">
                            <img src="${getCloudinaryUrl(p.img)}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/150'">
                        </div>
                        <div class="p-title">${p.name}</div>
                        <div class="p-price-row">
                            <div class="p-price">₹${p.price} <span class="p-old-price">₹${p.oldPrice}</span></div>
                            <button class="add-btn" onclick="event.stopPropagation(); CartManager.add(${JSON.stringify(p).replace(/"/g, '&quot;')})">
                                <i class="fas fa-plus"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Initialize
        window.onload = () => {
            renderCategories();
            loadProducts();
            CartManager.save(); // Sync badge
        };
    </script>
</body>
</html>
